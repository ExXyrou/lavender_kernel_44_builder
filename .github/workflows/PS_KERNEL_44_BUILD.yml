name: 🛠️ PREDATOR STORMBREAKER 4.4

on:
  workflow_dispatch:
    inputs:
      LOCALVERSION:
        description: '🏷️ Nama Kernel Kustom (misal: -MyKernel)'
        required: false
        type: string
      LOCALVERSION_AUTO:
        description: '❓ Aktifkan Auto Local Version'
        required: true
        default: false
        type: boolean
      APPEND_BUILD_DATE:
        description: '📅 Tambah Tanggal Build'
        required: true
        default: false
        type: boolean
      DEFAULT_HOSTNAME:
        description: '💻 Hostname Kernel (misal: xiaomi@redmi)'
        required: true
        default: xiaomi@redmi
        type: string
      BUILD_USER:
        description: '👤 Username Build (misal: xiaomi)'
        required: true
        default: xiaomi
        type: string
      BUILD_HOST:
        description: '🖥️ Hostname Build (misal: redmi)'
        required: true
        default: redmi
        type: string
      BUILD_NEWCAM:
        description: '📷 Gunakan Versi Newcam'
        required: true
        default: false
        type: boolean
      INJECT_KSU:
        description: '🦊 Sisipkan KernelSU'
        required: true
        default: false
        type: boolean

env:
  KERNEL_DIR: kernel_source
  CLANG_DIR: clang
  OUT_DIR: out
  ARCH: arm64
  SUBARCH: arm64
  KERNEL_URL: https://github.com/ExXyrou/predator_strombreaker_kernel.git
  KERNEL_BRANCH: oldcam
  DEFCONFIG: lavender-perf_defconfig
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: 🔄 Checkout Repositori
        uses: actions/checkout@v4

      - name: ⏱️ Catat Waktu Mulai
        run: echo "BUILD_START_TIME=$(date +%s)" >> $GITHUB_ENV
        
      - name: 📥 Clone Source Kernel
        run: |
          rm -rf "${{ env.KERNEL_DIR }}"
          git clone --depth=1 -b "${{ env.KERNEL_BRANCH }}" "${{ env.KERNEL_URL }}" "${{ env.KERNEL_DIR }}"

      - name: 📖 Baca Versi Kernel
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          KVER_MAJOR=$(grep -m1 '^VERSION =' Makefile | tr -d ' ' | cut -d'=' -f2)
          KVER_PATCH=$(grep -m1 '^PATCHLEVEL =' Makefile | tr -d ' ' | cut -d'=' -f2)
          KVER_SUB=$(grep -m1 '^SUBLEVEL =' Makefile | tr -d ' ' | cut -d'=' -f2)
          FULL_KVER="${KVER_MAJOR}.${KVER_PATCH}.${KVER_SUB}"
          echo "KERNEL_VERSION=$FULL_KVER" >> $GITHUB_ENV
          echo "✅ Versi Kernel Terdeteksi: $FULL_KVER"

      - name: 📦 Install Bahan Build
        timeout-minutes: 10
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          while sudo fuser /var/lib/dpkg/lock-frontend >/dev/null 2>&1; do
            echo "Menunggu proses apt selesai..."
            sleep 5
          done

          for i in 1 2 3; do
            sudo apt-get update -yq && break
            echo "Gagal update apt, percobaan ke-$i, mengulang..."
            sleep 10
          done

          sudo apt-get install -yq --no-install-recommends \
            -o Acquire::Retries=3 \
            bc bison libssl-dev libelf-dev build-essential python3 python3-pip curl git zip unzip wget ccache libncurses-dev rsync gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu gcc-arm-linux-gnueabi binutils-arm-linux-gnueabi
        
      - name: ⚡ Siapkan Cache Compiler
        run: |
          ccache --max-size=2G
          echo "CCACHE_DIR=$HOME/.ccache" >> $GITHUB_ENV

      - name: 💾 Pulihkan Cache Compiler
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-hmp-${{ env.DEFCONFIG }}-${{ github.run_id }}
          restore-keys: |
            ccache-hmp-${{ env.DEFCONFIG }}-

      - name: 🦊 Injeksi KernelSU
        if: ${{ inputs.INJECT_KSU == true }}
        working-directory: ${{ env.KERNEL_DIR }}
        run: curl -LSs "https://raw.githubusercontent.com/backslashxx/KernelSU/refs/heads/master/kernel/setup.sh" | bash -s master

      - name: 🧰 Pulihkan Cache AOSP Clang
        id: clang-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.CLANG_DIR }}
          key: clang-aosp-${{ hashFiles('.github/workflows/*.yml') }}

      - name: ⬇️ Download AOSP Clang
        if: steps.clang-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$CLANG_DIR" && cd "$CLANG_DIR"
          curl -LSs "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/android11-release/clang-r383902.tar.gz" -o aosp_clang.archive
          tar -xf aosp_clang.archive || unzip aosp_clang.archive && rm -f aosp_clang.archive

      - name: 🛠️ Perbaiki Error Resource
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          [ -f scripts/dtc/dtc-parser.tab.c ] && sed -i 's/^YYLTYPE yylloc;/extern YYLTYPE yylloc;/' scripts/dtc/dtc-parser.tab.c
          [ -f scripts/dtc/dtc-lexer.lex.c_shipped ] && sed -i 's/^YYLTYPE yylloc;/extern YYLTYPE yylloc;/' scripts/dtc/dtc-lexer.lex.c_shipped

      - name: ⚙️ Buat Defconfig
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          export PATH="$GITHUB_WORKSPACE/$CLANG_DIR/bin:$PATH"
          make O=$OUT_DIR ARCH=${{ env.ARCH }} CC=clang CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- ${{ env.DEFCONFIG }}

      - name: 📢 Info Telegram - Build Dimulai
        run: |
          MESSAGE=$(printf '🛠️ <b>PROSES BUILD DIMULAI</b>\n\n📱 <b>Perangkat:</b> <code>Lavender</code>\n🏷️ <b>Nama Kernel:</b> <code>%s-%s</code>\n📅 <b>Tambah Tanggal:</b> <code>%s</code>\n📷 <b>Versi Newcam:</b> <code>%s</code>\n🦊 <b>Injeksi KSU:</b> <code>%s</code>\n🛠️ <b>Versi Clang:</b> <code>AOSP Clang r383902</code>' "${{ env.KERNEL_VERSION }}" "${{ inputs.LOCALVERSION }}" "${{ inputs.APPEND_BUILD_DATE }}" "${{ inputs.BUILD_NEWCAM }}" "${{ inputs.INJECT_KSU }}")
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.BOT_API }}/sendMessage" --data-urlencode chat_id="${{ secrets.CHAT_ID }}" --data-urlencode parse_mode="HTML" --data-urlencode text="$MESSAGE"
          
      - name: 📝 Konfigurasi Config
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          export PATH="$GITHUB_WORKSPACE/$CLANG_DIR/bin:$PATH"
          
          enable_config() { ./scripts/config --file "$OUT_DIR/.config" --enable "$1"; }
          disable_config() { ./scripts/config --file "$OUT_DIR/.config" --disable "$1"; }
          set_config() { ./scripts/config --file "$OUT_DIR/.config" --set-val "$1" "$2"; }
          set_str() { ./scripts/config --file "$OUT_DIR/.config" --set-str "$1" "$2"; }

          set_str CONFIG_DEFAULT_HOSTNAME "${{ inputs.DEFAULT_HOSTNAME }}"
          
          if [ -n "${{ inputs.LOCALVERSION }}" ]; then
            echo "🏷️ Pakai nama kustom: ${{ inputs.LOCALVERSION }}"
            set_str CONFIG_LOCALVERSION "${{ inputs.LOCALVERSION }}"
          else
            echo "🏷️ Nama kustom kosong. Pakai bawaan defconfig."
          fi

          if [ "${{ inputs.LOCALVERSION_AUTO }}" == "true" ]; then
            enable_config CONFIG_LOCALVERSION_AUTO
          else
            disable_config CONFIG_LOCALVERSION_AUTO
          fi

          if [ "${{ inputs.APPEND_BUILD_DATE }}" == "true" ]; then
            echo "📅 Menambahkan tanggal di akhir versi kernel..."
            BUILD_DATE=$(date +'%Y%m%d')
            sed -i 's/echo "$res"/echo "$res-'"$BUILD_DATE"'"/' scripts/setlocalversion
          fi

          if [ "${{ inputs.BUILD_NEWCAM }}" == "true" ]; then
            echo "📷 Mengaktifkan dukungan Newcam..."
            enable_config CONFIG_XIAOMI_NEW_CAMERA_BLOBS
          fi

          if [ "${{ inputs.INJECT_KSU }}" == "true" ]; then
            echo "🦊 Memasang konfigurasi KernelSU..."
            enable_config CONFIG_KSU
            enable_config CONFIG_KSU_TAMPER_SYSCALL_TABLE
          fi

          make O=$OUT_DIR ARCH=${{ env.ARCH }} CC=clang olddefconfig

      - name: 🏗️ Mulai Build Kernel
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          export PATH="/usr/lib/ccache:$GITHUB_WORKSPACE/$CLANG_DIR/bin:$PATH"
          export KBUILD_BUILD_USER="${{ inputs.BUILD_USER }}"
          export KBUILD_BUILD_HOST="${{ inputs.BUILD_HOST }}"
          
          make -j$(nproc --all) O=$OUT_DIR ARCH=${{ env.ARCH }} CC="ccache clang" HOSTCC="ccache clang" HOSTCXX="ccache clang++" CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- KCFLAGS="-Wno-address -Wno-implicit-function-declaration" Image.gz-dtb 2>&1 | tee build.log

          if [ ! -f "$OUT_DIR/arch/arm64/boot/Image.gz-dtb" ]; then
            echo "❌ File Kernel (Image.gz-dtb) tidak ditemukan!"
            exit 1
          fi
          echo "✅ File Kernel berhasil dibuat."

      - name: 🔍 Buat File Zip Kernel
        id: img
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          IMAGE=$(find "$PWD/$OUT_DIR/arch/arm64/boot" -name "Image.gz-dtb" 2>/dev/null | head -n1)
          
          cd "$GITHUB_WORKSPACE"
          git clone --depth=1 https://github.com/ExXyrou/kernel_flashable AnyKernel3
          cp "$IMAGE" AnyKernel3/
          
          FINAL_LOCALVER="${{ inputs.LOCALVERSION }}"
          if [ -z "$FINAL_LOCALVER" ]; then
            FINAL_LOCALVER=$(grep "^CONFIG_LOCALVERSION=" "$GITHUB_WORKSPACE/$KERNEL_DIR/$OUT_DIR/.config" | cut -d'"' -f2 | sed 's/^-//')
          else
            FINAL_LOCALVER=$(echo "$FINAL_LOCALVER" | sed 's/^-//')
          fi
          
          sed -i -E 's/^(kernel\.string=).*/\1'"$FINAL_LOCALVER"'/' AnyKernel3/anykernel.sh
          
          TIMESTAMP=$(date +'%Y%m%d')
          
          if [ -n "$FINAL_LOCALVER" ]; then
            ZIP_NAME="lavender-${{ env.KERNEL_VERSION }}-${FINAL_LOCALVER}-${TIMESTAMP}.zip"
          else
            ZIP_NAME="lavender-${{ env.KERNEL_VERSION }}-${TIMESTAMP}.zip"
          fi
          
          cd AnyKernel3 && zip -r9 "$ZIP_NAME" * -x ".git/*"
          echo "zip_path=$GITHUB_WORKSPACE/AnyKernel3/$ZIP_NAME" >> "$GITHUB_OUTPUT"
          echo "zip_name=$ZIP_NAME" >> "$GITHUB_OUTPUT"

      - name: ✅ Info Telegram - Build Berhasil
        if: success()
        run: |
          END_TIME=$(date +%s)
          DURATION=$((END_TIME - ${{ env.BUILD_START_TIME }}))
          DURATION_STR="$((DURATION / 60))m $((DURATION % 60))s"

          MESSAGE=$(printf '✅ <b>BUILD BERHASIL</b>\n\n📱 <b>Perangkat:</b> <code>Lavender</code>\n🏷️ <b>Nama Kernel:</b> <code>%s-%s</code>\n📅 <b>Tambah Tanggal:</b> <code>%s</code>\n📷 <b>Versi Newcam:</b> <code>%s</code>\n🦊 <b>Injeksi KSU:</b> <code>%s</code>\n🛠️ <b>Versi Clang:</b> <code>AOSP Clang r383902</code>\n⏱️ <b>Waktu Proses:</b> <code>%s</code>' "${{ env.KERNEL_VERSION }}" "${{ inputs.LOCALVERSION }}" "${{ inputs.APPEND_BUILD_DATE }}" "${{ inputs.BUILD_NEWCAM }}" "${{ inputs.INJECT_KSU }}" "$DURATION_STR")
          
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.BOT_API }}/sendDocument" \
            -F chat_id="${{ secrets.CHAT_ID }}" \
            -F document="@${{ steps.img.outputs.zip_path }}" \
            -F parse_mode="HTML" \
            -F caption="$MESSAGE"

      - name: ❌ Info Telegram - Build Gagal
        if: failure()
        run: |
          END_TIME=$(date +%s)
          DURATION=$((END_TIME - ${{ env.BUILD_START_TIME }}))
          DURATION_STR="$((DURATION / 60))m $((DURATION % 60))s"

          MESSAGE=$(printf '❌ <b>BUILD GAGAL</b>\n\n📱 <b>Perangkat:</b> <code>Lavender</code>\n🏷️ <b>Nama Kernel:</b> <code>%s-%s</code>\n📅 <b>Tambah Tanggal:</b> <code>%s</code>\n📷 <b>Versi Newcam:</b> <code>%s</code>\n🦊 <b>Injeksi KSU:</b> <code>%s</code>\n🛠️ <b>Versi Clang:</b> <code>AOSP Clang r383902</code>\n⏱️ <b>Waktu Proses:</b> <code>%s</code>\n\n💥 <i>Cek file build.log di atas untuk melihat detail error.</i>' "${{ env.KERNEL_VERSION }}" "${{ inputs.LOCALVERSION }}" "${{ inputs.APPEND_BUILD_DATE }}" "${{ inputs.BUILD_NEWCAM }}" "${{ inputs.INJECT_KSU }}" "$DURATION_STR")
          
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.BOT_API }}/sendDocument" \
            -F chat_id="${{ secrets.CHAT_ID }}" \
            -F document="@${{ env.KERNEL_DIR }}/build.log" \
            -F parse_mode="HTML" \
            -F caption="$MESSAGE"
