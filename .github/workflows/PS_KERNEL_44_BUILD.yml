name: 🛠️ PREDATOR STROMBREAKER KERNEL 4.4 BUILD

on:
  workflow_dispatch:
    inputs:
      LOCALVERSION:
        description: '🏷️ Custom Kernel Name (e.g., -MyKernel-v1.0)'
        required: false
        type: string
      LOCALVERSION_AUTO:
        description: '❓ Enable Local Version Auto'
        required: true
        default: false
        type: boolean
      DEFAULT_HOSTNAME:
        description: '💻 Kernel Hostname (e.g., xiaomi@redmi)'
        required: true
        type: string
      BUILD_USER:
        description: '👤 Build Username (e.g., xiaomi)'
        required: true
        type: string
      BUILD_HOST:
        description: '🖥️ Build Hostname (e.g., redmi)'
        required: true
        type: string
      APPLY_TWEAKS:
        description: '🚀 Apply Performance & Gaming Tweaks'
        required: true
        default: false
        type: boolean
      INJECT_KSU:
        description: '🦊 Inject KernelSU'
        required: true
        default: false
        type: boolean

env:
  KERNEL_DIR: kernel_source
  CLANG_DIR: clang
  OUT_DIR: out
  ARCH: arm64
  SUBARCH: arm64
  KERNEL_URL: https://github.com/ExXyrou/predator_strombreaker_kernel.git
  KERNEL_BRANCH: oldcam
  DEFCONFIG: lavender-perf_defconfig
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: 🔄 Checkout Repository
        uses: actions/checkout@v4

      - name: ⏱️ Record Build Start Time
        run: echo "BUILD_START_TIME=$(date +%s)" >> $GITHUB_ENV
        
      - name: 📦 Install Build Dependencies
        timeout-minutes: 10
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          while sudo fuser /var/lib/dpkg/lock-frontend >/dev/null 2>&1; do
            echo "Waiting for apt lock to be released..."
            sleep 5
          done

          for i in 1 2 3; do
            sudo apt-get update -yq && break
            echo "apt-get update failed, attempt $i, retrying..."
            sleep 10
          done

          sudo apt-get install -yq --no-install-recommends \
            -o Acquire::Retries=3 \
            bc bison libssl-dev libelf-dev build-essential python3 python3-pip curl git zip unzip wget ccache libncurses-dev rsync gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu gcc-arm-linux-gnueabi binutils-arm-linux-gnueabi xz-utils
        
      - name: ⚡ Setup Compiler Cache
        run: |
          ccache --max-size=2G
          echo "CCACHE_DIR=$HOME/.ccache" >> $GITHUB_ENV

      - name: 💾 Restore Compiler Cache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-hmp-${{ env.DEFCONFIG }}-${{ github.run_id }}
          restore-keys: |
            ccache-hmp-${{ env.DEFCONFIG }}-

      - name: 📢 Notify Telegram - Build Started
        run: |
          MESSAGE=$(printf '🛠️ <b>START BUILD</b>\n\n📱 <b>Device:</b> Lavender\n🏷️ <b>Kernel name:</b> 4.4%s\n🦊 <b>Built-in KSU:</b> %s\n🛠️ <b>Clang Version:</b> AOSP Clang r383902' "${{ inputs.LOCALVERSION }}" "${{ inputs.INJECT_KSU }}")
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.BOT_API }}/sendMessage" --data-urlencode chat_id="${{ secrets.CHAT_ID }}" --data-urlencode parse_mode="HTML" --data-urlencode text="$MESSAGE"

      - name: 📥 Clone Kernel Source
        run: |
          rm -rf "${{ env.KERNEL_DIR }}"
          git clone --depth=1 -b "${{ env.KERNEL_BRANCH }}" "${{ env.KERNEL_URL }}" "${{ env.KERNEL_DIR }}"

      - name: 🦊 Inject KernelSU
        if: ${{ inputs.INJECT_KSU == true }}
        working-directory: ${{ env.KERNEL_DIR }}
        run: curl -LSs "https://raw.githubusercontent.com/backslashxx/KernelSU/refs/heads/master/kernel/setup.sh" | bash -s master

      - name: 🧰 Restore AOSP Clang Cache
        id: clang-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.CLANG_DIR }}
          key: clang-aosp-${{ hashFiles('.github/workflows/*.yml') }}

      - name: ⬇️ Download AOSP Clang
        if: steps.clang-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$CLANG_DIR" && cd "$CLANG_DIR"
          curl -LSs "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/android11-release/clang-r383902.tar.gz" -o aosp_clang.archive
          tar -xf aosp_clang.archive || unzip aosp_clang.archive && rm -f aosp_clang.archive

      - name: 🛠️ Fix Resource Errors
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          [ -f scripts/dtc/dtc-parser.tab.c ] && sed -i 's/^YYLTYPE yylloc;/extern YYLTYPE yylloc;/' scripts/dtc/dtc-parser.tab.c
          [ -f scripts/dtc/dtc-lexer.lex.c_shipped ] && sed -i 's/^YYLTYPE yylloc;/extern YYLTYPE yylloc;/' scripts/dtc/dtc-lexer.lex.c_shipped

      - name: ⚙️ Generate Defconfig
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          export PATH="$GITHUB_WORKSPACE/$CLANG_DIR/bin:$PATH"
          make O=$OUT_DIR ARCH=${{ env.ARCH }} CC=clang CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- ${{ env.DEFCONFIG }}

      - name: 📝 Apply Tweak & Configs
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          export PATH="$GITHUB_WORKSPACE/$CLANG_DIR/bin:$PATH"
          
          sed -i 's/CONFIG_DEFAULT_HOSTNAME=".*/CONFIG_DEFAULT_HOSTNAME="'"${{ inputs.DEFAULT_HOSTNAME }}"'"/' "$OUT_DIR/.config"
          [ -n "${{ inputs.LOCALVERSION }}" ] && sed -i 's/CONFIG_LOCALVERSION=".*/CONFIG_LOCALVERSION="'"${{ inputs.LOCALVERSION }}"'"/' "$OUT_DIR/.config"

          enable_config() { ./scripts/config --file "$OUT_DIR/.config" --enable "$1"; }
          disable_config() { ./scripts/config --file "$OUT_DIR/.config" --disable "$1"; }
          set_config() { ./scripts/config --file "$OUT_DIR/.config" --set-val "$1" "$2"; }
          set_str() { ./scripts/config --file "$OUT_DIR/.config" --set-str "$1" "$2"; }

          if [ "${{ inputs.LOCALVERSION_AUTO }}" == "true" ]; then
            enable_config CONFIG_LOCALVERSION_AUTO
          else
            disable_config CONFIG_LOCALVERSION_AUTO
          fi

          disable_config CONFIG_KERNEL_GZIP
          enable_config CONFIG_KERNEL_XZ
          enable_config CONFIG_RD_XZ
          sed -i 's/CONFIG_BUILD_ARM64_APPENDED_KERNEL_IMAGE_NAME="Image.gz-dtb"/CONFIG_BUILD_ARM64_APPENDED_KERNEL_IMAGE_NAME="Image.xz-dtb"/g' "$OUT_DIR/.config"

          if [ "${{ inputs.APPLY_TWEAKS }}" == "true" ]; then
            echo "🚀 Applying Performance & Gaming Tweaks for HMP kernel..."
            disable_config CONFIG_KASAN
            disable_config CONFIG_LOCKDEP
            disable_config CONFIG_MSM_KGSL_DEBUG
            set_config CONFIG_HZ 300
            enable_config CONFIG_HZ_300
            enable_config CONFIG_NO_HZ_IDLE
            enable_config CONFIG_SCHED_AUTOGROUP
            disable_config CONFIG_PM_AUTOSLEEP
            enable_config CONFIG_ZRAM
            enable_config CONFIG_ZRAM_LZ4_COMPRESS
            enable_config CONFIG_TCP_CONG_BBR
            set_str CONFIG_DEFAULT_TCP_CONG bbr
            enable_config CONFIG_MQ_IOSCHED_KYBER
            enable_config CONFIG_IOSCHED_BFQ
            set_str CONFIG_DEFAULT_IOSCHED "kyber"
            enable_config CONFIG_CPU_FREQ_GOV_INTERACTIVE
            set_str CONFIG_DEFAULT_GOVERNOR interactive
            enable_config CONFIG_CPU_BOOST
            enable_config CONFIG_CPU_INPUT_BOOST
            enable_config CONFIG_MSM_ADRENO_IDLER
            disable_config CONFIG_WQ_POWER_EFFICIENT_DEFAULT
          fi

          if [ "${{ inputs.INJECT_KSU }}" == "true" ]; then
            echo "🦊 Injecting KernelSU Config..."
            enable_config CONFIG_KSU
            enable_config CONFIG_KSU_TAMPER_SYSCALL_TABLE
          fi

          make O=$OUT_DIR ARCH=${{ env.ARCH }} CC=clang olddefconfig

      - name: 🏗️ Build Kernel Image
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          export PATH="/usr/lib/ccache:$GITHUB_WORKSPACE/$CLANG_DIR/bin:$PATH"
          export KBUILD_BUILD_USER="${{ inputs.BUILD_USER }}"
          export KBUILD_BUILD_HOST="${{ inputs.BUILD_HOST }}"
          make -j$(nproc --all) O=$OUT_DIR ARCH=${{ env.ARCH }} CC="ccache clang" HOSTCC="ccache clang" HOSTCXX="ccache clang++" CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- KCFLAGS="-Wno-address -Wno-implicit-function-declaration" 2>&1 | tee build.log

          if [ ! -f "$OUT_DIR/arch/arm64/boot/Image.xz-dtb" ] && [ ! -f "$OUT_DIR/arch/arm64/boot/Image.xz" ] && [ ! -f "$OUT_DIR/arch/arm64/boot/Image.gz-dtb" ] && [ ! -f "$OUT_DIR/arch/arm64/boot/Image.gz" ] && [ ! -f "$OUT_DIR/arch/arm64/boot/Image" ]; then
            echo "❌ Kernel image not found!"
            exit 1
          fi
          echo "✅ Kernel image created successfully."

      - name: 🔍 Locate Image, Compress to XZ, & Create Flashable Zip
        id: img
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          IMAGE=$(find "$PWD/$OUT_DIR/arch/arm64/boot" -type f \( -name "Image.xz-dtb" -o -name "Image.xz" -o -name "Image.gz-dtb" -o -name "Image.gz" -o -name "Image" \) | head -n1)
          
          if [ -z "$IMAGE" ]; then
            echo "❌ No kernel image found!"
            exit 1
          fi
          
          echo "📄 Found: $(basename "$IMAGE")"
          
          if [[ "$IMAGE" == *"dtb"* ]]; then
            OUTPUT_NAME="Image.xz-dtb"
          else
            OUTPUT_NAME="Image.xz"
          fi
          
          if [[ "$IMAGE" == *.xz ]]; then
            cp "$IMAGE" "$GITHUB_WORKSPACE/$OUTPUT_NAME"
            echo "✅ Image is already in .xz format"
          else
            echo "🗜️ Compressing image to .xz..."
            xz -f -k "$IMAGE" -c > "$GITHUB_WORKSPACE/$OUTPUT_NAME"
            echo "✅ Compression completed: $OUTPUT_NAME"
          fi
          
          cd "$GITHUB_WORKSPACE"
          git clone --depth=1 https://github.com/ExXyrou/san_kernel_flashable AnyKernel3
          
          cp "$GITHUB_WORKSPACE/$OUTPUT_NAME" AnyKernel3/
          
          cd AnyKernel3
          if [ -f anykernel.sh ]; then
            sed -i 's/Image\.gz-dtb/Image.xz-dtb/g; s/Image\.gz/Image.xz/g; s/Image$/Image.xz/g' anykernel.sh
            if grep -q "kernel_name=" anykernel.sh; then
              sed -i "s/^kernel_name=.*/kernel_name=\"$OUTPUT_NAME\"/" anykernel.sh
            fi
          fi
          
          FINAL_LOCALVER="${{ inputs.LOCALVERSION }}"
          [ -z "$FINAL_LOCALVER" ] && FINAL_LOCALVER=$(grep "^CONFIG_LOCALVERSION=" "$GITHUB_WORKSPACE/$KERNEL_DIR/$OUT_DIR/.config" | cut -d'"' -f2) || FINAL_LOCALVER=$(echo "$FINAL_LOCALVER" | sed 's/^-//')
          sed -i -E 's/^(kernel\.string=).*/\1'"$FINAL_LOCALVER"'/' anykernel.sh
          
          TIMESTAMP=$(date +'%Y%m%d')
          ZIP_NAME="Kernel-lavender-4.4${{ inputs.LOCALVERSION }}-${TIMESTAMP}.zip"
          zip -r9 "$ZIP_NAME" * -x ".git/*"
          
          echo "zip_path=$GITHUB_WORKSPACE/AnyKernel3/$ZIP_NAME" >> "$GITHUB_OUTPUT"
          echo "zip_name=$ZIP_NAME" >> "$GITHUB_OUTPUT"

      - name: ✅ Notify Telegram & Send Kernel - Build Success
        if: success()
        run: |
          END_TIME=$(date +%s)
          DURATION=$((END_TIME - ${{ env.BUILD_START_TIME }}))
          DURATION_STR="$((DURATION / 60))m $((DURATION % 60))s"

          MESSAGE=$(printf '✅ <b>BUILD SUCCESS</b>\n\n📱 <b>Device:</b> Lavender\n🏷️ <b>Kernel name:</b> 4.4%s\n🦊 <b>Built-in KSU:</b> %s\n🛠️ <b>Clang Version:</b> AOSP Clang r383902\n⏱️ <b>Time Elapsed:</b> %s' "${{ inputs.LOCALVERSION }}" "${{ inputs.INJECT_KSU }}" "$DURATION_STR")
          
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.BOT_API }}/sendDocument" \
            -F chat_id="${{ secrets.CHAT_ID }}" \
            -F document="@${{ steps.img.outputs.zip_path }}" \
            -F parse_mode="HTML" \
            -F caption="$MESSAGE"

      - name: ❌ Notify Telegram & Send Log - Build Failed
        if: failure()
        run: |
          END_TIME=$(date +%s)
          DURATION=$((END_TIME - ${{ env.BUILD_START_TIME }}))
          DURATION_STR="$((DURATION / 60))m $((DURATION % 60))s"

          MESSAGE=$(printf '❌ <b>BUILD FAILED</b>\n\n📱 <b>Device:</b> Lavender\n🏷️ <b>Kernel name:</b> 4.4%s\n🦊 <b>Built-in KSU:</b> %s\n🛠️ <b>Clang Version:</b> AOSP Clang r383902\n⏱️ <b>Time Elapsed:</b> %s\n\n💥 <i>Please check the build.log file above.</i>' "${{ inputs.LOCALVERSION }}" "${{ inputs.INJECT_KSU }}" "$DURATION_STR")
          
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.BOT_API }}/sendDocument" \
            -F chat_id="${{ secrets.CHAT_ID }}" \
            -F document="@${{ env.KERNEL_DIR }}/build.log" \
            -F parse_mode="HTML" \
            -F caption="$MESSAGE"
