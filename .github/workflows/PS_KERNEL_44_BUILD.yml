name: 🛠️ PREDATOR STORMBREAKER KERNEL 4.4

on:
  workflow_dispatch:
    inputs:
      LOCALVERSION:
        description: '🏷️ Custom Kernel Name (e.g., MyKernel-v1.0)'
        required: false
        type: string
      LOCALVERSION_AUTO:
        description: '🔧 Enable Localversion Auto'
        required: true
        default: false
        type: boolean
      DEFAULT_HOSTNAME:
        description: '💻 Kernel Hostname (e.g., xiaomi@redmi)'
        required: true
        default: xiaomi@redmi
        type: string
      BUILD_USER:
        description: '👤 Build Username (e.g., xiaomi)'
        required: true
        default: xiaomi
        type: string
      BUILD_HOST:
        description: '🖥️ Build Hostname (e.g., redmi)'
        required: true
        default: redmi
        type: string
      BUILD_NEWCAM:
        description: '📷 Use Newcam Build'
        required: true
        default: false
        type: boolean
      INJECT_KSU:
        description: '🦊 Inject KernelSU'
        required: true
        default: false
        type: boolean

env:
  KERNEL_DIR: kernel_source
  CLANG_DIR: clang
  OUT_DIR: out
  ARCH: arm64
  SUBARCH: arm64
  KERNEL_URL: https://github.com/ExXyrou/predator_strombreaker_kernel.git
  KERNEL_BRANCH: oldcam
  DEFCONFIG: lavender-perf_defconfig
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: 🔄 Checkout Repository
        uses: actions/checkout@v4

      - name: ⏱️ Record Build Start Time
        run: echo "BUILD_START_TIME=$(date +%s)" >> $GITHUB_ENV
        
      - name: 📥 Clone Kernel Source
        run: |
          rm -rf "${{ env.KERNEL_DIR }}"
          git clone --depth=1 -b "${{ env.KERNEL_BRANCH }}" "${{ env.KERNEL_URL }}" "${{ env.KERNEL_DIR }}"

      - name: 🔠 Configure Kernel Name String
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          CLEAN_INPUT=$(echo "${{ inputs.LOCALVERSION }}" | sed 's/^-//')
          
          if [ -n "$CLEAN_INPUT" ]; then
            FINAL_LOCAL="-${CLEAN_INPUT}"
          else
            FINAL_LOCAL=""
          fi
          
          echo "✅ Kernel string set to: $FINAL_LOCAL"
          echo "KERNEL_NAME_STRING=$FINAL_LOCAL" >> $GITHUB_ENV

      - name: 📖 Read Kernel Version
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          KVER_MAJOR=$(grep -m1 '^VERSION =' Makefile | tr -d ' ' | cut -d'=' -f2)
          KVER_PATCH=$(grep -m1 '^PATCHLEVEL =' Makefile | tr -d ' ' | cut -d'=' -f2)
          KVER_SUB=$(grep -m1 '^SUBLEVEL =' Makefile | tr -d ' ' | cut -d'=' -f2)
          FULL_KVER="${KVER_MAJOR}.${KVER_PATCH}.${KVER_SUB}"
          echo "KERNEL_VERSION=$FULL_KVER" >> $GITHUB_ENV
          echo "✅ Detected Kernel Version: $FULL_KVER"

      - name: 📦 Install Build Dependencies
        timeout-minutes: 10
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          while sudo fuser /var/lib/dpkg/lock-frontend >/dev/null 2>&1; do
            echo "Waiting for apt process to finish..."
            sleep 5
          done

          for i in 1 2 3; do
            sudo apt-get update -yq && break
            echo "apt update failed, attempt $i, retrying..."
            sleep 10
          done

          sudo apt-get install -yq --no-install-recommends \
            -o Acquire::Retries=3 \
            bc bison libssl-dev libelf-dev build-essential python3 python3-pip curl git zip unzip wget ccache libncurses-dev rsync gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu gcc-arm-linux-gnueabi binutils-arm-linux-gnueabi
        
      - name: ⚡ Setup Compiler Cache
        run: |
          ccache --max-size=2G
          echo "CCACHE_DIR=$HOME/.ccache" >> $GITHUB_ENV

      - name: 💾 Restore Compiler Cache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-hmp-${{ env.DEFCONFIG }}-${{ github.run_id }}
          restore-keys: |
            ccache-hmp-${{ env.DEFCONFIG }}-

      - name: 🦊 Setup KernelSU
        if: ${{ inputs.INJECT_KSU == true }}
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          curl -LSs "https://raw.githubusercontent.com/backslashxx/KernelSU/refs/heads/master/kernel/setup.sh" | bash -s master
          
          KSU_RELEASE_JSON=$(curl -s https://api.github.com/repos/backslashxx/KernelSU/releases/latest)
          KSU_TAG=$(echo "$KSU_RELEASE_JSON" | grep -o '"tag_name": *"[^"]*"' | head -n 1 | cut -d'"' -f4)
          if [ -n "$KSU_TAG" ]; then
            KSU_URL="https://github.com/backslashxx/KernelSU/releases/tag/$KSU_TAG"
          else
            KSU_URL="https://github.com/backslashxx/KernelSU/releases"
          fi
          echo "KSU_LINK=$KSU_URL" >> $GITHUB_ENV
          echo "✅ KernelSU Link: $KSU_URL"

      - name: 🧰 Restore AOSP Clang Cache
        id: clang-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.CLANG_DIR }}
          key: clang-aosp-${{ hashFiles('.github/workflows/*.yml') }}

      - name: ⬇️ Download AOSP Clang
        if: steps.clang-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$CLANG_DIR" && cd "$CLANG_DIR"
          curl -LSs "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/android11-release/clang-r383902.tar.gz" -o aosp_clang.archive
          tar -xf aosp_clang.archive || unzip aosp_clang.archive && rm -f aosp_clang.archive

      - name: 🛠️ Fix Resource Errors
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          [ -f scripts/dtc/dtc-parser.tab.c ] && sed -i 's/^YYLTYPE yylloc;/extern YYLTYPE yylloc;/' scripts/dtc/dtc-parser.tab.c
          [ -f scripts/dtc/dtc-lexer.lex.c_shipped ] && sed -i 's/^YYLTYPE yylloc;/extern YYLTYPE yylloc;/' scripts/dtc/dtc-lexer.lex.c_shipped

      - name: ⚙️ Generate Defconfig
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          export PATH="$GITHUB_WORKSPACE/$CLANG_DIR/bin:$PATH"
          make O=$OUT_DIR ARCH=${{ env.ARCH }} CC=clang CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- ${{ env.DEFCONFIG }}

      - name: 📢 Telegram Notification - Build Started
        run: |
          if [ "${{ inputs.BUILD_NEWCAM }}" == "true" ]; then
            CAM_TYPE="newcam"
          else
            CAM_TYPE="oldcam"
          fi

          MESSAGE=$(printf '🛠️ <b>BUILD STARTED</b>\n\n📱 <b>Device:</b> <code>Lavender</code>\n🏷️ <b>Kernel Name:</b> <code>%s%s</code>\n📷 <b>Build Type:</b> <code>%s</code>\n🦊 <b>KSU Injection:</b> <code>%s</code>\n🛠️ <b>Clang Version:</b> <code>AOSP Clang r383902</code>' "${{ env.KERNEL_VERSION }}" "${{ env.KERNEL_NAME_STRING }}" "$CAM_TYPE" "${{ inputs.INJECT_KSU }}")
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.BOT_API }}/sendMessage" --data-urlencode chat_id="${{ secrets.CHAT_ID }}" --data-urlencode parse_mode="HTML" --data-urlencode text="$MESSAGE"
          
      - name: 📝 Apply Tweaks & Configs
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          export PATH="$GITHUB_WORKSPACE/$CLANG_DIR/bin:$PATH"
          
          enable_config() { ./scripts/config --file "$OUT_DIR/.config" --enable "$1"; }
          disable_config() { ./scripts/config --file "$OUT_DIR/.config" --disable "$1"; }
          set_config() { ./scripts/config --file "$OUT_DIR/.config" --set-val "$1" "$2"; }
          set_str() { ./scripts/config --file "$OUT_DIR/.config" --set-str "$1" "$2"; }

          set_str CONFIG_DEFAULT_HOSTNAME "${{ inputs.DEFAULT_HOSTNAME }}"
          set_str CONFIG_LOCALVERSION "${{ env.KERNEL_NAME_STRING }}"

          if [ "${{ inputs.LOCALVERSION_AUTO }}" == "true" ]; then
            echo "🔧 Enabling CONFIG_LOCALVERSION_AUTO (clean mode)..."
            enable_config CONFIG_LOCALVERSION_AUTO
            
            if [ -d ".git" ]; then
              git config --global --add safe.directory "$PWD"
              git update-index --assume-unchanged $(git ls-files) || true
            fi
          else
            disable_config CONFIG_LOCALVERSION_AUTO
          fi

          if [ "${{ inputs.BUILD_NEWCAM }}" == "true" ]; then
            echo "📷 Enabling Newcam support..."
            enable_config CONFIG_XIAOMI_NEW_CAMERA_BLOBS
          fi

          if [ "${{ inputs.INJECT_KSU }}" == "true" ]; then
            echo "🦊 Applying KernelSU configuration..."
            enable_config CONFIG_KSU
            enable_config CONFIG_KSU_TAMPER_SYSCALL_TABLE
          fi

          make O=$OUT_DIR ARCH=${{ env.ARCH }} CC=clang olddefconfig

      - name: 🏗️ Start Kernel Build
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          export PATH="/usr/lib/ccache:$GITHUB_WORKSPACE/$CLANG_DIR/bin:$PATH"
          export KBUILD_BUILD_USER="${{ inputs.BUILD_USER }}"
          export KBUILD_BUILD_HOST="${{ inputs.BUILD_HOST }}"
          
          make -j$(nproc --all) O=$OUT_DIR ARCH=${{ env.ARCH }} CC="ccache clang" HOSTCC="ccache clang" HOSTCXX="ccache clang++" CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- KCFLAGS="-Wno-address -Wno-implicit-function-declaration" Image.gz-dtb 2>&1 | tee build.log

          if [ ! -f "$OUT_DIR/arch/arm64/boot/Image.gz-dtb" ]; then
            echo "❌ Kernel file (Image.gz-dtb) not found!"
            exit 1
          fi
          echo "✅ Kernel file successfully created."

      - name: 🔍 Create Kernel Zip
        id: img
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          IMAGE=$(find "$PWD/$OUT_DIR/arch/arm64/boot" -name "Image.gz-dtb" 2>/dev/null | head -n1)
          
          cd "$GITHUB_WORKSPACE"
          git clone --depth=1 https://github.com/ExXyrou/kernel_flashable AnyKernel3
          cp "$IMAGE" AnyKernel3/
          
          FINAL_LOCALVER="${{ env.KERNEL_NAME_STRING }}"
          FINAL_LOCALVER=$(echo "$FINAL_LOCALVER" | sed 's/^-//')
          
          sed -i -E 's/^(kernel\.string=).*/\1'"$FINAL_LOCALVER"'/' AnyKernel3/anykernel.sh
          
          TIMESTAMP=$(date +'%Y%m%d')
          
          if [ -n "$FINAL_LOCALVER" ]; then
            ZIP_NAME="lavender-${{ env.KERNEL_VERSION }}${{ env.KERNEL_NAME_STRING }}-${TIMESTAMP}.zip"
          else
            ZIP_NAME="lavender-${{ env.KERNEL_VERSION }}-${TIMESTAMP}.zip"
          fi
          
          cd AnyKernel3 && zip -r9 "$ZIP_NAME" * -x ".git/*"
          echo "zip_path=$GITHUB_WORKSPACE/AnyKernel3/$ZIP_NAME" >> "$GITHUB_OUTPUT"
          echo "zip_name=$ZIP_NAME" >> "$GITHUB_OUTPUT"

      - name: ✅ Telegram Notification - Build Success
        if: success()
        run: |
          END_TIME=$(date +%s)
          DURATION=$((END_TIME - ${{ env.BUILD_START_TIME }}))
          DURATION_STR="$((DURATION / 60))m $((DURATION % 60))s"

          if [ "${{ inputs.BUILD_NEWCAM }}" == "true" ]; then
            CAM_TYPE="newcam"
          else
            CAM_TYPE="oldcam"
          fi

          if [ "${{ inputs.INJECT_KSU }}" == "true" ]; then
            KSU_TEXT="true (<a href=\"${{ env.KSU_LINK }}\">link</a>)"
          else
            KSU_TEXT="false"
          fi

          MESSAGE=$(printf '✅ <b>BUILD SUCCESS</b>\n\n📱 <b>Device:</b> <code>Lavender</code>\n🏷️ <b>Kernel Name:</b> <code>%s%s</code>\n📷 <b>Build Type:</b> <code>%s</code>\n🦊 <b>KSU Injection:</b> %s\n🛠️ <b>Clang Version:</b> <code>AOSP Clang r383902</code>\n⏱️ <b>Time Elapsed:</b> <code>%s</code>' "${{ env.KERNEL_VERSION }}" "${{ env.KERNEL_NAME_STRING }}" "$CAM_TYPE" "$KSU_TEXT" "$DURATION_STR")
          
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.BOT_API }}/sendDocument" \
            -F chat_id="${{ secrets.CHAT_ID }}" \
            -F document="@${{ steps.img.outputs.zip_path }}" \
            -F parse_mode="HTML" \
            -F caption="$MESSAGE"

      - name: ❌ Telegram Notification - Build Failed
        if: failure()
        run: |
          END_TIME=$(date +%s)
          DURATION=$((END_TIME - ${{ env.BUILD_START_TIME }}))
          DURATION_STR="$((DURATION / 60))m $((DURATION % 60))s"

          if [ "${{ inputs.BUILD_NEWCAM }}" == "true" ]; then
            CAM_TYPE="newcam"
          else
            CAM_TYPE="oldcam"
          fi

          MESSAGE=$(printf '❌ <b>BUILD FAILED</b>\n\n📱 <b>Device:</b> <code>Lavender</code>\n🏷️ <b>Kernel Name:</b> <code>%s%s</code>\n📷 <b>Build Type:</b> <code>%s</code>\n🦊 <b>KSU Injection:</b> <code>%s</code>\n🛠️ <b>Clang Version:</b> <code>AOSP Clang r383902</code>\n⏱️ <b>Time Elapsed:</b> <code>%s</code>\n\n💥 <i>Check the build.log file above for error details.</i>' "${{ env.KERNEL_VERSION }}" "${{ env.KERNEL_NAME_STRING }}" "$CAM_TYPE" "${{ inputs.INJECT_KSU }}" "$DURATION_STR")
          
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.BOT_API }}/sendDocument" \
            -F chat_id="${{ secrets.CHAT_ID }}" \
            -F document="@${{ env.KERNEL_DIR }}/build.log" \
            -F parse_mode="HTML" \
            -F caption="$MESSAGE"
