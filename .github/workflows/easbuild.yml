name: 🛠️ EAS KERNEL BUILDER

on:
  workflow_dispatch:
    inputs:
      LOCALVERSION:
        description: '🏷️ Custom Kernel Name (e.g., -MyKernel-v1.0)'
        required: false
        type: string
      DEFAULT_HOSTNAME:
        description: '💻 Kernel Hostname (e.g., xiaomi@redmi)'
        required: true
        type: string
      BUILD_USER:
        description: '👤 Build Username (e.g., xiaomi)'
        required: true
        type: string
      BUILD_HOST:
        description: '🖥️ Build Hostname (e.g., redmi)'
        required: true
        type: string
      APPLY_TWEAKS:
        description: '🚀 Apply Performance & Gaming Tweaks'
        required: true
        default: false
        type: boolean
      INJECT_KSU:
        description: '🦊 Inject KernelSU'
        required: true
        default: false
        type: boolean

env:
  KERNEL_DIR: kernel_source
  CLANG_DIR: clang
  OUT_DIR: out
  ARCH: arm64
  SUBARCH: arm64
  KERNEL_URL: https://github.com/ExXyrou/san_kernel.git
  KERNEL_BRANCH: oldcam
  DEFCONFIG: lavender_defconfig
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 🔄 Checkout Repository
        uses: actions/checkout@v4

      - name: ⏱️ Record Build Start Time
        run: echo "BUILD_START_TIME=$(date +%s)" >> $GITHUB_ENV

      - name: 📦 Install Dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y bc bison libssl-dev libelf-dev build-essential python3 python3-pip curl git zip unzip wget ccache libncurses-dev rsync gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu gcc-arm-linux-gnueabi binutils-arm-linux-gnueabi

      - name: ⬇️ Download ZyC Clang 15.0.7
        run: |
          mkdir -p "$CLANG_DIR" && cd "$CLANG_DIR"
          wget -q https://github.com/ZyCromerZ/Clang/releases/download/15.0.7-20230316-release/Clang-15.0.7.tar.gz
          tar -xf Clang-15.0.7.tar.gz
          echo "CLANG_VERSION=ZyC-Clang-15.0.7" >> $GITHUB_ENV

      - name: 📥 Clone Kernel Source
        run: |
          git clone --depth=1 -b "${{ env.KERNEL_BRANCH }}" "${{ env.KERNEL_URL }}" "${{ env.KERNEL_DIR }}"

      - name: 🦊 Inject KernelSU
        if: ${{ inputs.INJECT_KSU == true }}
        working-directory: ${{ env.KERNEL_DIR }}
        run: curl -LSs "https://raw.githubusercontent.com/backslashxx/KernelSU/refs/heads/master/kernel/setup.sh" | bash -s master

      - name: 🏗️ Build Kernel
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          export PATH="$GITHUB_WORKSPACE/$CLANG_DIR/bin:$PATH"
          make O=$OUT_DIR ARCH=${{ env.ARCH }} ${{ env.DEFCONFIG }}
          make -j$(nproc --all) O=$OUT_DIR ARCH=${{ env.ARCH }} CC="clang" CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- CONFIG_LOCALVERSION_AUTO=n 2>&1 | tee build.log

      - name: 🔍 Package Zip
        id: img
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          IMAGE=$(find "$PWD/$OUT_DIR/arch/arm64/boot" -name "Image.gz-dtb" -o -name "Image.gz" | head -n1)
          cd "$GITHUB_WORKSPACE"
          git clone --depth=1 https://github.com/ExXyrou/kernel_flashable AnyKernel3
          cp "$IMAGE" AnyKernel3/
          TIMESTAMP=$(date +'%Y%m%d')
          ZIP_NAME="Kernel-EAS-lavender-${TIMESTAMP}.zip"
          cd AnyKernel3 && zip -r9 "$ZIP_NAME" * -x ".git/*"
          echo "zip_path=$GITHUB_WORKSPACE/AnyKernel3/$ZIP_NAME" >> "$GITHUB_OUTPUT"

      - name: ✅ Notify Telegram - Success
        if: success()
        run: |
          END_TIME=$(date +%s)
          DURATION=$((END_TIME - ${{ env.BUILD_START_TIME }}))
          DUR_STR="$((DURATION / 60))m $((DURATION % 60))s"
          MSG=$(printf '✅ <b>BUILD SUCCESS</b>\n\n📱 <b>Device:</b> Lavender\n🏷️ <b>Kernel Name:</b> %s\n⏱️ <b>Duration:</b> %s\n🛠️ <b>Clang:</b> %s' "${{ inputs.LOCALVERSION }}" "$DUR_STR" "${{ env.CLANG_VERSION }}")
          
          curl -s -X POST "https://api.telegram.org/bot8171609290:AAHLG3pBdv7BGZXJ6B1USXZvqYa4M-QeQb8/sendMessage" -d chat_id="${{ secrets.CHAT_ID }}" -d parse_mode="HTML" -d text="$MSG"
          curl -s -X POST "https://api.telegram.org/bot8171609290:AAHLG3pBdv7BGZXJ6B1USXZvqYa4M-QeQb8/sendDocument" -F chat_id="${{ secrets.CHAT_ID }}" -F document=@"${{ steps.img.outputs.zip_path }}"

      - name: ❌ Notify Telegram - Failed
        if: failure()
        run: |
          MSG=$(printf '❌ <b>BUILD FAILED</b>\n\n📱 <b>Device:</b> Lavender\n🏷️ <b>Kernel Name:</b> %s\n🛠️ <b>Clang:</b> %s\n\nCheck logs for details.' "${{ inputs.LOCALVERSION }}" "${{ env.CLANG_VERSION }}")
          curl -s -X POST "https://api.telegram.org/bot8171609290:AAHLG3pBdv7BGZXJ6B1USXZvqYa4M-QeQb8/sendMessage" -d chat_id="${{ secrets.CHAT_ID }}" -d parse_mode="HTML" -d text="$MSG"
