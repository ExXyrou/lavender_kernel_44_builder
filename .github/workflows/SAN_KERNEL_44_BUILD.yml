name: 🛠️ SAN KERNEL 4.4

on:
  workflow_dispatch:
    inputs:
      KERNEL_BRANCH:
        description: '🌿 Pilih Branch Kernel'
        required: true
        default: 'PLTS'
        type: choice
        options:
          - PLTS
          - st74
          - st78
      DISPLAY_BRANCH_NAME:
        description: '🏷️ Tampilkan Nama Branch'
        required: true
        default: false
        type: boolean
      LOCALVERSION:
        description: '🏷️ Nama Kernel Kustom (misal: -MyKernel)'
        required: false
        type: string
      LOCALVERSION_AUTO:
        description: '❓ Aktifkan Auto Local Version'
        required: true
        default: false
        type: boolean
      APPEND_BUILD_DATE:
        description: '📅 Tambah Tanggal Build'
        required: true
        default: false
        type: boolean
      DEFAULT_HOSTNAME:
        description: '💻 Hostname Kernel (misal: xiaomi@redmi)'
        required: true
        default: xiaomi@redmi
        type: string
      BUILD_USER:
        description: '👤 Username Build (misal: xiaomi)'
        required: true
        default: xiaomi
        type: string
      BUILD_HOST:
        description: '🖥️ Hostname Build (misal: redmi)'
        required: true
        default: redmi
        type: string
      QTI_HAPTICS:
        description: '📳 Sisipkan Dukungan QTI Haptics'
        required: true
        default: false
        type: boolean
      BUILD_NEWCAM:
        description: '📷 Gunakan Versi Newcam'
        required: true
        default: false
        type: boolean
      INJECT_KSU:
        description: '🦊 Sisipkan KernelSU'
        required: true
        default: false
        type: boolean

env:
  KERNEL_DIR: kernel_source
  CLANG_DIR: clang
  OUT_DIR: out
  ARCH: arm64
  SUBARCH: arm64
  KERNEL_URL: https://github.com/ExXyrou/san_kernel.git
  DEFCONFIG: lavender_defconfig
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: 🔄 Checkout Repositori
        uses: actions/checkout@v4

      - name: ⏱️ Catat Waktu Mulai
        run: echo "BUILD_START_TIME=$(date +%s)" >> $GITHUB_ENV

      - name: 🔠 Atur String Nama Kernel
        run: |
          if [ "${{ inputs.DISPLAY_BRANCH_NAME }}" == "true" ]; then
            echo "KERNEL_NAME_STRING=-${{ inputs.KERNEL_BRANCH }}${{ inputs.LOCALVERSION }}" >> $GITHUB_ENV
          else
            echo "KERNEL_NAME_STRING=${{ inputs.LOCALVERSION }}" >> $GITHUB_ENV
          fi

      - name: 📥 Clone Source Kernel
        run: |
          rm -rf "${{ env.KERNEL_DIR }}"
          git clone --depth=1 -b "${{ inputs.KERNEL_BRANCH }}" "${{ env.KERNEL_URL }}" "${{ env.KERNEL_DIR }}"

      - name: 📖 Baca Versi Kernel
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          KVER_MAJOR=$(grep -m1 '^VERSION =' Makefile | tr -d ' ' | cut -d'=' -f2)
          KVER_PATCH=$(grep -m1 '^PATCHLEVEL =' Makefile | tr -d ' ' | cut -d'=' -f2)
          KVER_SUB=$(grep -m1 '^SUBLEVEL =' Makefile | tr -d ' ' | cut -d'=' -f2)
          FULL_KVER="${KVER_MAJOR}.${KVER_PATCH}.${KVER_SUB}"
          echo "KERNEL_VERSION=$FULL_KVER" >> $GITHUB_ENV
          echo "✅ Versi Kernel Terdeteksi: $FULL_KVER"

      - name: 📦 Install Bahan Build
        timeout-minutes: 10
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          while sudo fuser /var/lib/dpkg/lock-frontend >/dev/null 2>&1; do
            echo "Menunggu proses apt selesai..."
            sleep 5
          done

          for i in 1 2 3; do
            sudo apt-get update -yq && break
            echo "Gagal update apt, percobaan ke-$i, mengulang..."
            sleep 10
          done

          sudo apt-get install -yq --no-install-recommends \
            -o Acquire::Retries=3 \
            bc bison libssl-dev libelf-dev build-essential python3 python3-pip curl git zip unzip wget ccache libncurses-dev rsync gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu gcc-arm-linux-gnueabi binutils-arm-linux-gnueabi xz-utils

      - name: ⚡ Siapkan Cache Compiler
        run: |
          ccache --max-size=2G
          echo "CCACHE_DIR=$HOME/.ccache" >> $GITHUB_ENV

      - name: 💾 Pulihkan Cache Compiler
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-eas-${{ env.DEFCONFIG }}-${{ github.run_id }}
          restore-keys: |
            ccache-eas-${{ env.DEFCONFIG }}-
            
      - name: 🦊 Injeksi KernelSU
        if: ${{ inputs.INJECT_KSU == true }}
        working-directory: ${{ env.KERNEL_DIR }}
        run: curl -LSs "https://raw.githubusercontent.com/backslashxx/KernelSU/refs/heads/master/kernel/setup.sh" | bash -s master

      - name: 🧰 Pulihkan Cache ZyC Clang
        id: clang-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.CLANG_DIR }}
          key: clang-zyc-v2-${{ hashFiles('.github/workflows/*.yml') }}

      - name: ⬇️ Download ZyC Clang 15.0.7
        if: steps.clang-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$CLANG_DIR"
          echo "Mengambil URL rilis terbaru ZyC Clang 15.0.7..."

          CLANG_URL=$(curl -s https://api.github.com/repos/ZyCromerZ/Clang/releases | grep -o "https://github.com/ZyCromerZ/Clang/releases/download/.*/Clang-15.0.7-.*\.tar\.gz" | head -n 1)
          
          if [ -z "$CLANG_URL" ]; then
            echo "Error: Gagal mendapatkan URL download Clang!"
            exit 1
          fi
          
          echo "Mendownload dari: $CLANG_URL"
          curl -LSs "$CLANG_URL" -o zyc_clang.tar.gz
          
          echo "Mengekstrak Clang..."
          tar -zxf zyc_clang.tar.gz -C "$CLANG_DIR"
          rm -f zyc_clang.tar.gz
          
          if [ ! -d "$CLANG_DIR/bin" ]; then
            CLANG_SUBDIR=$(find "$CLANG_DIR" -mindepth 1 -maxdepth 1 -type d | head -n 1)
            if [ -n "$CLANG_SUBDIR" ]; then
              mv "$CLANG_SUBDIR"/* "$CLANG_DIR/"
            fi
          fi
          
          echo "CLANG_VERSION=ZyC Clang 15.0.7" >> $GITHUB_ENV

      - name: 🛠️ Perbaiki Error Resource
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          [ -f kernel/sched/sched.h ] && sed -i 's/cpu_rq(cpu)->cfs->cumulative_runnable_avg/cpu_rq(cpu)->cfs.cumulative_runnable_avg/g' kernel/sched/sched.h

      - name: 📢 Info Telegram - Build Dimulai
        run: |
          MESSAGE=$(printf '🛠️ <b>PROSES BUILD DIMULAI</b>\n\n📱 <b>Perangkat:</b> <code>Lavender</code>\n🏷️ <b>Nama Kernel:</b> <code>%s%s</code>\n📅 <b>Tambah Tanggal:</b> <code>%s</code>\n📷 <b>Versi Newcam:</b> <code>%s</code>\n📳 <b>Dukungan QTI Haptics:</b> <code>%s</code>\n🦊 <b>Injeksi KSU:</b> <code>%s</code>\n🛠️ <b>Versi Clang:</b> <code>ZyC Clang 15.0.7</code>' "${{ env.KERNEL_VERSION }}" "${{ env.KERNEL_NAME_STRING }}" "${{ inputs.APPEND_BUILD_DATE }}" "${{ inputs.BUILD_NEWCAM }}" "${{ inputs.QTI_HAPTICS }}" "${{ inputs.INJECT_KSU }}")
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.BOT_API }}/sendMessage" --data-urlencode chat_id="${{ secrets.CHAT_ID }}" --data-urlencode parse_mode="HTML" --data-urlencode text="$MESSAGE"

      - name: ⚙️ Buat Defconfig
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          export PATH="$GITHUB_WORKSPACE/$CLANG_DIR/bin:$PATH"
          
          make O=$OUT_DIR ARCH=${{ env.ARCH }} \
            CC="$GITHUB_WORKSPACE/$CLANG_DIR/bin/clang" \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- ${{ env.DEFCONFIG }}

      - name: 📝 Konfigurasi Config
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          export PATH="$GITHUB_WORKSPACE/$CLANG_DIR/bin:$PATH"
          
          sed -i 's/CONFIG_DEFAULT_HOSTNAME=".*/CONFIG_DEFAULT_HOSTNAME="'"${{ inputs.DEFAULT_HOSTNAME }}"'"/' "$OUT_DIR/.config"
          
          [ -n "${{ env.KERNEL_NAME_STRING }}" ] && sed -i 's/CONFIG_LOCALVERSION=".*/CONFIG_LOCALVERSION="'"${{ env.KERNEL_NAME_STRING }}"'"/' "$OUT_DIR/.config"

          enable_config() { ./scripts/config --file "$OUT_DIR/.config" --enable "$1"; }
          disable_config() { ./scripts/config --file "$OUT_DIR/.config" --disable "$1"; }
          set_config() { ./scripts/config --file "$OUT_DIR/.config" --set-val "$1" "$2"; }
          set_str() { ./scripts/config --file "$OUT_DIR/.config" --set-str "$1" "$2"; }
          
          if [ "${{ inputs.LOCALVERSION_AUTO }}" == "true" ]; then
            enable_config CONFIG_LOCALVERSION_AUTO
          else
            disable_config CONFIG_LOCALVERSION_AUTO
          fi

          if [ "${{ inputs.APPEND_BUILD_DATE }}" == "true" ]; then
            echo "📅 Menambahkan tanggal di akhir versi kernel..."
            BUILD_DATE=$(date +'%Y%m%d')
            sed -i 's/echo "$res"/echo "$res-'"$BUILD_DATE"'"/' scripts/setlocalversion
          fi

          disable_config CONFIG_KERNEL_GZIP
          enable_config CONFIG_KERNEL_XZ
          enable_config CONFIG_RD_XZ
          sed -i 's/CONFIG_BUILD_ARM64_APPENDED_KERNEL_IMAGE_NAME="Image.gz-dtb"/CONFIG_BUILD_ARM64_APPENDED_KERNEL_IMAGE_NAME="Image.xz-dtb"/g' "$OUT_DIR/.config"

          if [ "${{ inputs.QTI_HAPTICS }}" == "true" ]; then
            echo "📳 Mengaktifkan dukungan QTI Haptics..."
            enable_config CONFIG_INPUT_QTI_HAPTICS
          fi
          
          if [ "${{ inputs.BUILD_NEWCAM }}" == "true" ]; then
            echo "📷 Mengaktifkan dukungan Newcam..."
            enable_config CONFIG_XIAOMI_NEW_CAMERA_BLOBS
          fi

          if [ "${{ inputs.INJECT_KSU }}" == "true" ]; then
            echo "🦊 Memasang konfigurasi KernelSU..."
            enable_config CONFIG_KSU
            enable_config CONFIG_KSU_TAMPER_SYSCALL_TABLE
          fi

          make O=$OUT_DIR ARCH=${{ env.ARCH }} \
            CC="$GITHUB_WORKSPACE/$CLANG_DIR/bin/clang" \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- olddefconfig

      - name: 🏗️ Mulai Build Kernel
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          export PATH="/usr/lib/ccache:$GITHUB_WORKSPACE/$CLANG_DIR/bin:$PATH"
          export KBUILD_BUILD_USER="${{ inputs.BUILD_USER }}"
          export KBUILD_BUILD_HOST="${{ inputs.BUILD_HOST }}"
          
          make -j$(nproc --all) O=$OUT_DIR ARCH=${{ env.ARCH }} \
            CC="ccache $GITHUB_WORKSPACE/$CLANG_DIR/bin/clang" \
            HOSTCC="ccache $GITHUB_WORKSPACE/$CLANG_DIR/bin/clang" \
            HOSTCXX="ccache $GITHUB_WORKSPACE/$CLANG_DIR/bin/clang++" \
            AR="$GITHUB_WORKSPACE/$CLANG_DIR/bin/llvm-ar" \
            NM="$GITHUB_WORKSPACE/$CLANG_DIR/bin/llvm-nm" \
            OBJCOPY="$GITHUB_WORKSPACE/$CLANG_DIR/bin/llvm-objcopy" \
            OBJDUMP="$GITHUB_WORKSPACE/$CLANG_DIR/bin/llvm-objdump" \
            STRIP="$GITHUB_WORKSPACE/$CLANG_DIR/bin/llvm-strip" \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            KCFLAGS="-Wno-address -Wno-implicit-function-declaration" 2>&1 | tee build.log

          if [ ! -f "$OUT_DIR/arch/arm64/boot/Image.xz-dtb" ] && [ ! -f "$OUT_DIR/arch/arm64/boot/Image.xz" ] && [ ! -f "$OUT_DIR/arch/arm64/boot/Image.gz-dtb" ] && [ ! -f "$OUT_DIR/arch/arm64/boot/Image.gz" ] && [ ! -f "$OUT_DIR/arch/arm64/boot/Image" ]; then
            echo "❌ File Kernel tidak ditemukan!"
            exit 1
          fi
          echo "✅ File Kernel berhasil dibuat."

      - name: 🔍 Buat Zip Kernel (Format XZ)
        id: img
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          IMAGE=$(find "$PWD/$OUT_DIR/arch/arm64/boot" -type f \( -name "Image.xz-dtb" -o -name "Image.xz" -o -name "Image.gz-dtb" -o -name "Image.gz" -o -name "Image" \) | head -n1)
          
          if [ -z "$IMAGE" ]; then
            echo "❌ File Kernel tidak ditemukan!"
            exit 1
          fi
          
          echo "📄 Menemukan: $(basename "$IMAGE")"
          
          if [[ "$IMAGE" == *"dtb"* ]]; then
            OUTPUT_NAME="Image.xz-dtb"
          else
            OUTPUT_NAME="Image.xz"
          fi
          
          if [[ "$IMAGE" == *.xz ]]; then
            cp "$IMAGE" "$GITHUB_WORKSPACE/$OUTPUT_NAME"
            echo "✅ Format file sudah .xz"
          else
            echo "🗜️ Mengkompresi kernel ke format .xz..."
            xz -f -k "$IMAGE" -c > "$GITHUB_WORKSPACE/$OUTPUT_NAME"
            echo "✅ Kompresi selesai: $OUTPUT_NAME"
          fi
          
          cd "$GITHUB_WORKSPACE"
          git clone --depth=1 https://github.com/ExXyrou/san_kernel_flashable AnyKernel3
          
          cp "$GITHUB_WORKSPACE/$OUTPUT_NAME" AnyKernel3/
          
          cd AnyKernel3
          if [ -f anykernel.sh ]; then
            sed -i 's/Image\.gz-dtb/Image.xz-dtb/g; s/Image\.gz/Image.xz/g; s/Image$/Image.xz/g' anykernel.sh
            if grep -q "kernel_name=" anykernel.sh; then
              sed -i "s/^kernel_name=.*/kernel_name=\"$OUTPUT_NAME\"/" anykernel.sh
            fi
          fi
          
          FINAL_LOCALVER="${{ env.KERNEL_NAME_STRING }}"
          FINAL_LOCALVER=$(echo "$FINAL_LOCALVER" | sed 's/^-//')
          sed -i -E 's/^(kernel\.string=).*/\1'"$FINAL_LOCALVER"'/' anykernel.sh
          
          TIMESTAMP=$(date +'%Y%m%d')
          ZIP_NAME="lavender-${{ env.KERNEL_VERSION }}${{ env.KERNEL_NAME_STRING }}-${TIMESTAMP}.zip"
          zip -r9 "$ZIP_NAME" * -x ".git/*"
          
          echo "zip_path=$GITHUB_WORKSPACE/AnyKernel3/$ZIP_NAME" >> "$GITHUB_OUTPUT"
          echo "zip_name=$ZIP_NAME" >> "$GITHUB_OUTPUT"

      - name: ✅ Info Telegram - Build Berhasil
        if: success()
        run: |
          END_TIME=$(date +%s)
          DURATION=$((END_TIME - ${{ env.BUILD_START_TIME }}))
          DURATION_STR="$((DURATION / 60))m $((DURATION % 60))s"

          MESSAGE=$(printf '✅ <b>BUILD BERHASIL</b>\n\n📱 <b>Perangkat:</b> <code>Lavender</code>\n🏷️ <b>Nama Kernel:</b> <code>%s%s</code>\n📅 <b>Tambah Tanggal:</b> <code>%s</code>\n📷 <b>Versi Newcam:</b> <code>%s</code>\n📳 <b>Dukungan QTI Haptics:</b> <code>%s</code>\n🦊 <b>Injeksi KSU:</b> <code>%s</code>\n🛠️ <b>Versi Clang:</b> <code>ZyC Clang 15.0.7</code>\n⏱️ <b>Waktu Proses:</b> <code>%s</code>' "${{ env.KERNEL_VERSION }}" "${{ env.KERNEL_NAME_STRING }}" "${{ inputs.APPEND_BUILD_DATE }}" "${{ inputs.BUILD_NEWCAM }}" "${{ inputs.QTI_HAPTICS }}" "${{ inputs.INJECT_KSU }}" "$DURATION_STR")
          
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.BOT_API }}/sendDocument" \
            -F chat_id="${{ secrets.CHAT_ID }}" \
            -F document="@${{ steps.img.outputs.zip_path }}" \
            -F parse_mode="HTML" \
            -F caption="$MESSAGE"

      - name: ❌ Info Telegram - Build Gagal
        if: failure()
        run: |
          END_TIME=$(date +%s)
          DURATION=$((END_TIME - ${{ env.BUILD_START_TIME }}))
          DURATION_STR="$((DURATION / 60))m $((DURATION % 60))s"

          MESSAGE=$(printf '❌ <b>BUILD GAGAL</b>\n\n📱 <b>Perangkat:</b> <code>Lavender</code>\n🏷️ <b>Nama Kernel:</b> <code>%s%s</code>\n📅 <b>Tambah Tanggal:</b> <code>%s</code>\n📷 <b>Versi Newcam:</b> <code>%s</code>\n📳 <b>Dukungan QTI Haptics:</b> <code>%s</code>\n🦊 <b>Injeksi KSU:</b> <code>%s</code>\n🛠️ <b>Versi Clang:</b> <code>ZyC Clang 15.0.7</code>\n⏱️ <b>Waktu Proses:</b> <code>%s</code>\n\n💥 <i>Cek file build.log di atas untuk melihat detail error.</i>' "${{ env.KERNEL_VERSION }}" "${{ env.KERNEL_NAME_STRING }}" "${{ inputs.APPEND_BUILD_DATE }}" "${{ inputs.BUILD_NEWCAM }}" "${{ inputs.QTI_HAPTICS }}" "${{ inputs.INJECT_KSU }}" "$DURATION_STR")
          
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.BOT_API }}/sendDocument" \
            -F chat_id="${{ secrets.CHAT_ID }}" \
            -F document="@${{ env.KERNEL_DIR }}/build.log" \
            -F parse_mode="HTML" \
            -F caption="$MESSAGE"
