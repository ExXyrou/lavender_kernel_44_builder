name: 🛠️ Lavender Kernel Builder

on:
  workflow_dispatch:
    inputs:
      KERNEL_SOURCE:
        description: '🔗 Select Kernel Source'
        required: true
        default: 'eas'
        type: choice
        options:
          - eas
          - hmp

      LOCALVERSION:
        description: '🏷️ Custom Kernel Name (e.g., -MyKernel-v1.0)'
        required: false
        type: string

      DEFAULT_HOSTNAME:
        description: '💻 Kernel Hostname (e.g., xiaomi@redmi)'
        required: true
        type: string

      BUILD_USER:
        description: '👤 Build Username (e.g., xiaomi)'
        required: true
        type: string

      BUILD_HOST:
        description: '🖥️ Build Hostname (e.g., redmi)'
        required: true
        type: string

      KERNEL_TWEAK:
        description: '🚀 Select Performance Profile'
        required: true
        default: 'none'
        type: choice
        options:
          - none
          - eas
          - hmp

      INJECT_KSU:
        description: '🦊 Select KernelSU Integration'
        required: true
        default: 'none'
        type: choice
        options:
          - none
          - xxKSU

env:
  KERNEL_DIR: kernel_source
  CLANG_DIR: clang
  OUT_DIR: out
  ARCH: arm64
  SUBARCH: arm64
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 🔄 Checkout Repository
        uses: actions/checkout@v4

      - name: ⏱️ Record Build Start Time
        run: echo "BUILD_START_TIME=$(date +%s)" >> $GITHUB_ENV

      - name: 📦 Install Build Dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update -yq
          sudo apt-get install -yq --no-install-recommends \
            bc bison libssl-dev libelf-dev \
            build-essential python3 python3-pip curl git zip unzip wget ccache \
            libncurses-dev rsync \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi binutils-arm-linux-gnueabi
            
      - name: ⚡ Setup Compiler Cache
        run: |
          ccache --max-size=2G
          echo "CCACHE_DIR=$HOME/.ccache" >> $GITHUB_ENV

      - name: 🔗 Resolve Kernel Source, Branch & Defconfig
        id: resolve-url-branch
        run: |
          KERNEL_SRC="${{ inputs.KERNEL_SOURCE }}"

          if [ "$KERNEL_SRC" == "eas" ]; then
            echo "FINAL_KERNEL_URL=https://github.com/ExXyrou/san_kernel.git" >> $GITHUB_ENV
            echo "FINAL_KERNEL_BRANCH=oldcam" >> $GITHUB_ENV
            echo "FINAL_KERNEL_DEFCONFIG=lavender_defconfig" >> $GITHUB_ENV
            echo "✅ Source: EAS | Branch: oldcam | Defconfig: lavender_defconfig"
          elif [ "$KERNEL_SRC" == "hmp" ]; then
            echo "FINAL_KERNEL_URL=https://github.com/ExXyrou/predator_strombreaker_kernel.git" >> $GITHUB_ENV
            echo "FINAL_KERNEL_BRANCH=oldcam" >> $GITHUB_ENV
            echo "FINAL_KERNEL_DEFCONFIG=lavender-perf_defconfig" >> $GITHUB_ENV
            echo "✅ Source: HMP | Branch: oldcam | Defconfig: lavender-perf_defconfig"
          fi

      - name: 💾 Restore Compiler Cache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-${{ env.FINAL_KERNEL_DEFCONFIG }}-${{ github.run_id }}
          restore-keys: |
            ccache-${{ env.FINAL_KERNEL_DEFCONFIG }}-

      - name: 🔗 Resolve Clang Toolchain Logic
        id: resolve-clang
        run: |
          KERNEL_SRC="${{ inputs.KERNEL_SOURCE }}"

          if [ "$KERNEL_SRC" == "eas" ]; then
            echo "FINAL_CLANG_SOURCE=neutron" >> $GITHUB_ENV
            echo "✅ Neutron Clang automatically selected for EAS Kernel."
          elif [ "$KERNEL_SRC" == "hmp" ]; then
            echo "FINAL_CLANG_SOURCE=AOSP" >> $GITHUB_ENV
            echo "FINAL_CLANG_URL=https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/android11-release/clang-r383902.tar.gz" >> $GITHUB_ENV
            echo "✅ AOSP Clang (clang-r383902) automatically selected for HMP Kernel."
          fi

      - name: 📢 Notify Telegram - Build Started
        run: |
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          MESSAGE=$(printf '🛠️ <b>VIP LAVENDER KERNEL BUILD STARTED</b>\n━━━━━━━━━━━━━━━━━━━\n📱 <b>Device:</b> Lavender (Redmi Note 7)\n🔗 <b>Source:</b> %s\n🏷️ <b>Kernel Name:</b> 4.4%s\n🦊 <b>KSU:</b> %s\n👤 <b>Triggered by:</b> %s' \
            "${{ inputs.KERNEL_SOURCE }}" \
            "${{ inputs.LOCALVERSION }}" \
            "${{ inputs.INJECT_KSU }}" \
            "@${{ github.actor }}")

          curl -s -X POST "https://api.telegram.org/bot8171609290:AAHLG3pBdv7BGZXJ6B1USXZvqYa4M-QeQb8/sendMessage" \
            --data-urlencode chat_id="${{ secrets.CHAT_ID }}" \
            --data-urlencode parse_mode="HTML" \
            --data-urlencode text="$MESSAGE" \
            --data-urlencode reply_markup="{\"inline_keyboard\":[[{\"text\":\"📄 View Logs\",\"url\":\"$RUN_URL\"}]]}"

      - name: 📥 Clone Kernel Source
        run: |
          echo "🔄 Cloning kernel source repository..."
          rm -rf "${{ env.KERNEL_DIR }}"

          git clone --depth=1 -b "${{ env.FINAL_KERNEL_BRANCH }}" "${{ env.FINAL_KERNEL_URL }}" "${{ env.KERNEL_DIR }}"

          echo "========================================"
          echo "         KERNEL SOURCE DETAILS          "
          echo "========================================"
          git -C "${{ env.KERNEL_DIR }}" log -1 --oneline
          echo "========================================"

      - name: 🦊 Inject KernelSU
        if: ${{ inputs.INJECT_KSU == 'xxKSU' }}
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          echo "Injecting xxKSU integration..."
          curl -LSs "https://raw.githubusercontent.com/backslashxx/KernelSU/refs/heads/master/kernel/setup.sh" | bash -s master

      - name: 🧰 Restore Clang Toolchain Cache
        id: clang-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.CLANG_DIR }}
          key: clang-${{ env.FINAL_CLANG_SOURCE }}-${{ hashFiles('.github/workflows/*.yml') }}

      - name: ⬇️ Download Clang Compiler (Neutron)
        if: env.FINAL_CLANG_SOURCE == 'neutron' && steps.clang-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$CLANG_DIR" && cd "$CLANG_DIR"
          curl -LSs "https://raw.githubusercontent.com/Neutron-Toolchains/antman/main/antman" > antman
          chmod +x antman
          ./antman -S

      - name: ⬇️ Download Clang Compiler (AOSP)
        if: env.FINAL_CLANG_SOURCE == 'AOSP' && steps.clang-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$CLANG_DIR" && cd "$CLANG_DIR"
          curl -LSs "${{ env.FINAL_CLANG_URL }}" -o aosp_clang.archive
          tar -xf aosp_clang.archive || unzip aosp_clang.archive
          rm -f aosp_clang.archive

      - name: 🛠️ Fix Resource Errors
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          if [ -f scripts/dtc/dtc-parser.tab.c ]; then
            sed -i \
              's/^YYLTYPE yylloc;/extern YYLTYPE yylloc;/' \
              scripts/dtc/dtc-parser.tab.c
          fi

          if [ -f scripts/dtc/dtc-lexer.lex.c_shipped ]; then
            sed -i \
              's/^YYLTYPE yylloc;/extern YYLTYPE yylloc;/' \
              scripts/dtc/dtc-lexer.lex.c_shipped
          fi

          if [ -f kernel/sched/sched.h ]; then
            sed -i 's/cpu_rq(cpu)->cfs->cumulative_runnable_avg/cpu_rq(cpu)->cfs.cumulative_runnable_avg/g' kernel/sched/sched.h
          fi

      - name: ⚙️ Generate Kernel Configuration (Defconfig)
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          export PATH="$GITHUB_WORKSPACE/$CLANG_DIR/bin:$PATH"

          make \
            O=$OUT_DIR \
            ARCH=${{ env.ARCH }} \
            CC=clang \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            ${{ env.FINAL_KERNEL_DEFCONFIG }}

      - name: 📝 Apply Performance Tweaks & Kernel Configs
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          export PATH="$GITHUB_WORKSPACE/$CLANG_DIR/bin:$PATH"

          if [ ! -f scripts/config ]; then
            echo "❌ Error: 'scripts/config' helper was not found in the kernel source."
            exit 1
          fi

          # Set Hostname & Localversion
          sed -i 's/CONFIG_DEFAULT_HOSTNAME=".*/CONFIG_DEFAULT_HOSTNAME="'"${{ inputs.DEFAULT_HOSTNAME }}"'"/' "$OUT_DIR/.config"
          if ! grep -q "CONFIG_DEFAULT_HOSTNAME=" "$OUT_DIR/.config"; then echo "CONFIG_DEFAULT_HOSTNAME=\"${{ inputs.DEFAULT_HOSTNAME }}\"" >> "$OUT_DIR/.config"; fi

          if [ -n "${{ inputs.LOCALVERSION }}" ]; then
            sed -i 's/CONFIG_LOCALVERSION=".*/CONFIG_LOCALVERSION="'"${{ inputs.LOCALVERSION }}"'"/' "$OUT_DIR/.config"
            if ! grep -q "CONFIG_LOCALVERSION=" "$OUT_DIR/.config"; then echo "CONFIG_LOCALVERSION=\"${{ inputs.LOCALVERSION }}\"" >> "$OUT_DIR/.config"; fi
          fi

          # Helper functions
          set_config() {
              local cfg="$1"
              local val="$2"
              if [ "$val" = "y" ]; then
                  ./scripts/config --file "$OUT_DIR/.config" --enable "$cfg"
              elif [ "$val" = "n" ]; then
                  ./scripts/config --file "$OUT_DIR/.config" --disable "$cfg"
              else
                  ./scripts/config --file "$OUT_DIR/.config" --set-val "$cfg" "$val"
              fi
          }

          enable_config() { ./scripts/config --file "$OUT_DIR/.config" --enable "$1"; }
          disable_config() { ./scripts/config --file "$OUT_DIR/.config" --disable "$1"; }

          if [ "${{ inputs.KERNEL_TWEAK }}" == "none" ]; then
            echo "ℹ️ Performance profile set to 'none'. Skipping optimizations."
          else
            disable_config CONFIG_DEBUG_INFO
            disable_config CONFIG_KASAN
            disable_config CONFIG_LOCKDEP
            disable_config CONFIG_DEBUG_KERNEL
            disable_config CONFIG_FTRACE
            disable_config CONFIG_PROFILING
            disable_config CONFIG_SLUB_DEBUG
            disable_config CONFIG_PM_DEBUG
            disable_config CONFIG_SCHED_DEBUG
            disable_config CONFIG_DEBUG_PREEMPT
            disable_config CONFIG_MSM_KGSL_DEBUG
            disable_config CONFIG_CORESIGHT
            disable_config CONFIG_BUGON_DATA_CORRUPTION
            disable_config CONFIG_SCHED_STACK_END_CHECK
            enable_config CONFIG_JUMP_LABEL
            set_config CONFIG_HZ 300
            enable_config CONFIG_HZ_300
            disable_config CONFIG_HZ_1000
            disable_config CONFIG_HZ_100
            enable_config CONFIG_SCHED_AUTOGROUP
            enable_config CONFIG_NO_HZ_IDLE
            enable_config CONFIG_HIGH_RES_TIMERS
            enable_config CONFIG_WQ_POWER_EFFICIENT_DEFAULT
            enable_config CONFIG_PM_AUTOSLEEP
            enable_config CONFIG_PM_WAKELOCKS
            enable_config CONFIG_ZRAM
            enable_config CONFIG_CRYPTO_LZ4
            enable_config CONFIG_ZRAM_LZ4_COMPRESS
            disable_config CONFIG_ZRAM_LZO_COMPRESS
            enable_config CONFIG_TCP_CONG_BBR
            enable_config CONFIG_NET_SCH_FQ
            ./scripts/config --file "$OUT_DIR/.config" --set-str CONFIG_DEFAULT_TCP_CONG bbr
            enable_config CONFIG_BLOCK
            enable_config CONFIG_BLK_DEV_INITRD
            enable_config CONFIG_MQ_IOSCHED_DEADLINE
            enable_config CONFIG_MQ_IOSCHED_KYBER
            enable_config CONFIG_IOSCHED_BFQ
            enable_config CONFIG_BFQ_GROUP_IOSCHED
            enable_config CONFIG_CPU_BOOST
            enable_config CONFIG_CPU_FREQ_GOV_PERFORMANCE

            if [[ "${{ inputs.KERNEL_TWEAK }}" == "eas" ]]; then
              echo "⚡ [EAS] Applying EAS Specific Scheduler & Governor tweaks..."
              enable_config CONFIG_DYNAMIC_STUNE_BOOST
              enable_config CONFIG_SCHED_TUNE
              enable_config CONFIG_CGROUP_SCHEDTUNE
              enable_config CONFIG_SCHED_WALT
              enable_config CONFIG_ENERGY_MODEL
              enable_config CONFIG_CPU_FREQ_GOV_SCHEDUTIL
              enable_config CONFIG_CPU_FREQ_DEFAULT_GOV_SCHEDUTIL
              ./scripts/config --file "$OUT_DIR/.config" --set-str CONFIG_DEFAULT_GOVERNOR schedutil
            elif [[ "${{ inputs.KERNEL_TWEAK }}" == "hmp" ]]; then
              echo "⚡ [HMP] Applying HMP Specific Scheduler & Governor tweaks..."
              enable_config CONFIG_CPU_FREQ_GOV_INTERACTIVE
              enable_config CONFIG_CPU_FREQ_DEFAULT_GOV_INTERACTIVE
              ./scripts/config --file "$OUT_DIR/.config" --set-str CONFIG_DEFAULT_GOVERNOR interactive
            fi
            
          fi

          if [ "${{ inputs.INJECT_KSU }}" == "xxKSU" ]; then
            echo "Configuring xxKSU Build Options..."
            enable_config CONFIG_KSU
            enable_config CONFIG_KSU_TAMPER_SYSCALL_TABLE
          fi

          make O=$OUT_DIR ARCH=${{ env.ARCH }} CC=clang olddefconfig

      - name: 🏗️ Build Kernel Image
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          set -o pipefail

          export KCFLAGS="-Wno-address -Wno-implicit-function-declaration"

          export PATH="/usr/lib/ccache:$GITHUB_WORKSPACE/$CLANG_DIR/bin:$PATH"
          export ARCH=${{ env.ARCH }}
          export SUBARCH=${{ env.SUBARCH }}

          export HOSTCFLAGS="-fcommon -Wno-deprecated-declarations"
          export HOSTCXXFLAGS="-fcommon -Wno-deprecated-declarations"

          export KBUILD_BUILD_USER="${{ inputs.BUILD_USER }}"
          export KBUILD_BUILD_HOST="${{ inputs.BUILD_HOST }}"

          echo "========================================"
          echo "            COMPILING KERNEL            "
          echo "========================================"

          make -j$(nproc --all) \
            O=$OUT_DIR \
            ARCH=${{ env.ARCH }} \
            CC="ccache clang" \
            HOSTCC="ccache clang" \
            HOSTCXX="ccache clang++" \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            CONFIG_LOCALVERSION_AUTO=n \
            KCFLAGS="$KCFLAGS" \
            2>&1 | tee build.log

      - name: 📄 Upload Build Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: ${{ env.KERNEL_DIR }}/build.log

      - name: 🔍 Locate Image & Create Flashable Zip
        id: img
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          BOOT_DIR="$PWD/$OUT_DIR/arch/arm64/boot"
          IMAGE=""

          for target in "Image.gz-dtb" "Image.gz" "Image"; do
            FOUND=$(find "$BOOT_DIR" -name "$target" 2>/dev/null | head -n1)
            if [ -n "$FOUND" ]; then
              IMAGE="$FOUND"
              break
            fi
          done

          if [ -z "$IMAGE" ]; then
            echo "❌ Error: No compiled kernel image found in $BOOT_DIR"
            exit 1
          fi

          echo "image_path=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "✅ Kernel image successfully located: $IMAGE"

          cd "$GITHUB_WORKSPACE"
          rm -rf AnyKernel3
          git clone --depth=1 https://github.com/ExXyrou/kernel_flashable AnyKernel3
          cp "$IMAGE" AnyKernel3/

          INPUT_LOCALVER="${{ inputs.LOCALVERSION }}"
          FINAL_LOCALVER=""

          if [ -n "$INPUT_LOCALVER" ]; then
            FINAL_LOCALVER=$(echo "$INPUT_LOCALVER" | sed 's/^-//')
          else
            CONFIG_FILE="$GITHUB_WORKSPACE/$KERNEL_DIR/$OUT_DIR/.config"
            if [ -f "$CONFIG_FILE" ]; then
              FINAL_LOCALVER=$(grep "^CONFIG_LOCALVERSION=" "$CONFIG_FILE" | cut -d'"' -f2 | sed 's/^-//')
            fi
          fi

          if [ -z "$FINAL_LOCALVER" ]; then
            FINAL_LOCALVER="Unofficial"
          fi

          if [ -f "AnyKernel3/anykernel.sh" ]; then
            sed -i -E 's/^(kernel\.string=).*/\1'"$FINAL_LOCALVER"'/' AnyKernel3/anykernel.sh
            echo "✅ Updated kernel.string in anykernel.sh to: $FINAL_LOCALVER"
          fi

          mkdir -p AnyKernel3/modules/system/lib/modules AnyKernel3/patch AnyKernel3/ramdisk
          touch AnyKernel3/modules/system/lib/modules/placeholder AnyKernel3/patch/placeholder AnyKernel3/ramdisk/placeholder

          TIMESTAMP=$(date +'%Y%m%d')
          ZIP_NAME="Kernel-lavender-4.4${{ inputs.LOCALVERSION }}-${TIMESTAMP}.zip"
          echo "🏷️ Flashable Zip Name: $ZIP_NAME"

          cd AnyKernel3
          zip -r9 "$ZIP_NAME" * -x ".git/*"

          echo "zip_path=$GITHUB_WORKSPACE/AnyKernel3/$ZIP_NAME" >> "$GITHUB_OUTPUT"
          echo "zip_name=$ZIP_NAME" >> "$GITHUB_OUTPUT"
          echo "timestamp=$TIMESTAMP" >> "$GITHUB_OUTPUT"
          echo "final_localver=$FINAL_LOCALVER" >> "$GITHUB_OUTPUT"
          echo "🚀 Flashable zip created successfully: $ZIP_NAME"

      - name: 🚀 Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "#${{ github.run_number }}"
          name: "Kernel lavender 4.4${{ inputs.LOCALVERSION }}"
          body: |
            ### 📱 Redmi Note 7 Kernel Build
            - **Kernel Version:** 4.4${{ inputs.LOCALVERSION }}
            - **KernelSU Variant:** ${{ inputs.INJECT_KSU }}
            - **Build Date:** `${{ steps.img.outputs.timestamp }}`
          files: ${{ steps.img.outputs.zip_path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: ✅ Notify Telegram - Build Success
        if: success()
        run: |
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          RELEASE_URL="${{ github.server_url }}/${{ github.repository }}/releases/tag/%23${{ github.run_number }}"
          END_TIME=$(date +%s)
          DURATION=$((END_TIME - ${{ env.BUILD_START_TIME }}))
          DURATION_STR="$((DURATION / 60))m $((DURATION % 60))s"

          MESSAGE=$(printf '✅ <b>KERNEL BUILD SUCCESSFUL</b>\n━━━━━━━━━━━━━━━━━━━\n📱 <b>Device:</b> Lavender (Redmi Note 7)\n🔗 <b>Source:</b> %s\n🏷️ <b>Kernel Name:</b> 4.4%s\n🦊 <b>KSU:</b> %s\n📦 <b>File:</b> <code>%s</code>\n⏱️ <b>Duration:</b> %s\n👤 <b>Triggered by:</b> %s\n━━━━━━━━━━━━━━━━━━━\n🎉 Your flashable kernel is ready!' \
            "${{ inputs.KERNEL_SOURCE }}" \
            "${{ inputs.LOCALVERSION }}" \
            "${{ inputs.INJECT_KSU }}" \
            "${{ steps.img.outputs.zip_name }}" \
            "$DURATION_STR" \
            "@${{ github.actor }}")

          curl -s -X POST "https://api.telegram.org/bot8171609290:AAHLG3pBdv7BGZXJ6B1USXZvqYa4M-QeQb8/sendMessage" \
            --data-urlencode chat_id="${{ secrets.CHAT_ID }}" \
            --data-urlencode parse_mode="HTML" \
            --data-urlencode text="$MESSAGE" \
            --data-urlencode reply_markup="{\"inline_keyboard\":[[{\"text\":\"📄 View Logs\",\"url\":\"$RUN_URL\"},{\"text\":\"⬇️ Download Release\",\"url\":\"$RELEASE_URL\"}]]}"

      - name: ❌ Notify Telegram - Build Failed
        if: failure()
        run: |
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          END_TIME=$(date +%s)
          DURATION=$((END_TIME - ${{ env.BUILD_START_TIME }}))
          DURATION_STR="$((DURATION / 60))m $((DURATION % 60))s"

          MESSAGE=$(printf '❌ <b>KERNEL BUILD FAILED</b>\n━━━━━━━━━━━━━━━━━━━\n📱 <b>Device:</b> Lavender (Redmi Note 7)\n🔗 <b>Source:</b> %s\n🏷️ <b>Kernel Name:</b> 4.4%s\n🦊 <b>KSU:</b> %s\n⏱️ <b>Duration:</b> %s\n👤 <b>Triggered by:</b> %s\n━━━━━━━━━━━━━━━━━━━\n💥 Something went wrong. Please check the logs below for details.' \
            "${{ inputs.KERNEL_SOURCE }}" \
            "${{ inputs.LOCALVERSION }}" \
            "${{ inputs.INJECT_KSU }}" \
            "$DURATION_STR" \
            "@${{ github.actor }}")

          curl -s -X POST "https://api.telegram.org/bot8171609290:AAHLG3pBdv7BGZXJ6B1USXZvqYa4M-QeQb8/sendMessage" \
            --data-urlencode chat_id="${{ secrets.CHAT_ID }}" \
            --data-urlencode parse_mode="HTML" \
            --data-urlencode text="$MESSAGE" \
            --data-urlencode reply_markup="{\"inline_keyboard\":[[{\"text\":\"📄 View Logs\",\"url\":\"$RUN_URL\"}]]}"
