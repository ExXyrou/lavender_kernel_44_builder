name: 🛠️ TES BUILD SAN KERNEL 4.4

on:
  workflow_dispatch:
    inputs:
      KERNEL_BRANCH:
        description: '🌿 Select Kernel Branch'
        required: true
        default: 'oldcam'
        type: choice
        options:
          - oldcam
          - oldcam-ksun
          - oldcam-resukisu
      LOCALVERSION:
        description: '🏷️ Custom Kernel Name (e.g., -MyKernel-v1.0)'
        required: false
        type: string
      DEFAULT_HOSTNAME:
        description: '💻 Kernel Hostname (e.g., xiaomi@redmi)'
        required: true
        type: string
      BUILD_USER:
        description: '👤 Build Username (e.g., xiaomi)'
        required: true
        type: string
      BUILD_HOST:
        description: '🖥️ Build Hostname (e.g., redmi)'
        required: true
        type: string
      QTI_HAPTICS:
        description: '📳 Add Qti Haptics'
        required: true
        default: false
        type: boolean
      APPLY_TWEAKS:
        description: '🚀 Apply Performance & Gaming Tweaks'
        required: true
        default: false
        type: boolean
      INJECT_KSU:
        description: '🦊 Inject xxKernelSU (Only for oldcam branch)'
        required: true
        default: false
        type: boolean

env:
  KERNEL_DIR: kernel_source
  CLANG_DIR: clang
  OUT_DIR: out
  ARCH: arm64
  SUBARCH: arm64
  KERNEL_URL: https://github.com/ExXyrou/san_kernel.git
  DEFCONFIG: lavender_defconfig
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 🔄 Checkout Repository
        uses: actions/checkout@v4

      - name: ⏱️ Record Build Start Time
        run: echo "BUILD_START_TIME=$(date +%s)" >> $GITHUB_ENV

      - name: 🏷️ Determine KernelSU Type Info
        id: ksu-info
        run: |
          BRANCH="${{ inputs.KERNEL_BRANCH }}"
          if [ "$BRANCH" == "oldcam" ]; then
            if [ "${{ inputs.INJECT_KSU }}" == "true" ]; then
              echo "ksu_name=xxKernelSU" >> $GITHUB_OUTPUT
            else
              echo "ksu_name=None" >> $GITHUB_OUTPUT
            fi
          elif [ "$BRANCH" == "oldcam-ksun" ]; then
            echo "ksu_name=KernelSU Next" >> $GITHUB_OUTPUT
          elif [ "$BRANCH" == "oldcam-resukisu" ]; then
            echo "ksu_name=ResukiSU" >> $GITHUB_OUTPUT
          else
            echo "ksu_name=Unknown" >> $GITHUB_OUTPUT
          fi

      - name: 📦 Install Build Dependencies
        timeout-minutes: 10
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          while sudo fuser /var/lib/dpkg/lock-frontend >/dev/null 2>&1; do
            echo "Waiting for apt lock to be released..."
            sleep 5
          done

          for i in 1 2 3; do
            sudo apt-get update -yq && break
            echo "apt-get update failed, attempt $i, retrying..."
            sleep 10
          done

          sudo apt-get install -yq --no-install-recommends \
            -o Acquire::Retries=3 \
            bc bison libssl-dev libelf-dev build-essential python3 python3-pip curl git zip unzip wget ccache libncurses-dev rsync gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu gcc-arm-linux-gnueabi binutils-arm-linux-gnueabi

      - name: ⚡ Setup Compiler Cache
        run: |
          ccache --max-size=2G
          echo "CCACHE_DIR=$HOME/.ccache" >> $GITHUB_ENV

      - name: 💾 Restore Compiler Cache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-eas-${{ env.DEFCONFIG }}-${{ github.run_id }}
          restore-keys: |
            ccache-eas-${{ env.DEFCONFIG }}-

      - name: 📢 Notify Telegram - Build Started
        run: |
          MESSAGE=$(printf '🛠️ <b>START BUILD</b>\n\n📱 <b>Device:</b> Lavender\n🌿 <b>Branch:</b> %s\n🏷️ <b>Kernel name:</b> 4.4%s\n📳 <b>Supported QTI Haptics:</b> %s\n🦊 <b>KernelSU Variant:</b> %s\n🛠️ <b>Clang Version:</b> ZyC Clang 15.0.7' "${{ inputs.KERNEL_BRANCH }}" "${{ inputs.LOCALVERSION }}" "${{ inputs.QTI_HAPTICS }}" "${{ steps.ksu-info.outputs.ksu_name }}")
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.BOT_API }}/sendMessage" --data-urlencode chat_id="${{ secrets.CHAT_ID }}" --data-urlencode parse_mode="HTML" --data-urlencode text="$MESSAGE"

      - name: 📥 Clone Kernel Source
        run: |
          rm -rf "${{ env.KERNEL_DIR }}"
          git clone --depth=1 -b "${{ inputs.KERNEL_BRANCH }}" "${{ env.KERNEL_URL }}" "${{ env.KERNEL_DIR }}"

      - name: 🦊 Inject KernelSU
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          BRANCH="${{ inputs.KERNEL_BRANCH }}"
          if [ "$BRANCH" == "oldcam" ] && [ "${{ inputs.INJECT_KSU }}" == "true" ]; then
            echo "Injecting xxKernelSU..."
            curl -LSs "https://raw.githubusercontent.com/backslashxx/KernelSU/refs/heads/master/kernel/setup.sh" | bash -s master
          elif [ "$BRANCH" == "oldcam-ksun" ]; then
            echo "Injecting KernelSU Next..."
            curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -s legacy
          elif [ "$BRANCH" == "oldcam-resukisu" ]; then
            echo "Injecting ResukiSU..."
            curl -LSs "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh" | bash
          else
            echo "Skipping KSU injection"
          fi

      - name: 🧰 Restore ZyC Clang Cache
        id: clang-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.CLANG_DIR }}
          key: clang-zyc-v2-${{ hashFiles('.github/workflows/*.yml') }}

      - name: ⬇️ Download ZyC Clang 15.0.7
        if: steps.clang-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$CLANG_DIR"
          echo "Fetching latest ZyC Clang 15.0.7 release URL..."

          CLANG_URL=$(curl -s https://api.github.com/repos/ZyCromerZ/Clang/releases | grep -o "https://github.com/ZyCromerZ/Clang/releases/download/.*/Clang-15.0.7-.*\.tar\.gz" | head -n 1)
          
          if [ -z "$CLANG_URL" ]; then
            echo "Error: Failed to fetch Clang download URL!"
            exit 1
          fi
          
          echo "Downloading from: $CLANG_URL"
          curl -LSs "$CLANG_URL" -o zyc_clang.tar.gz
          
          echo "Extracting Clang..."
          tar -zxf zyc_clang.tar.gz -C "$CLANG_DIR"
          rm -f zyc_clang.tar.gz
          
          if [ ! -d "$CLANG_DIR/bin" ]; then
            CLANG_SUBDIR=$(find "$CLANG_DIR" -mindepth 1 -maxdepth 1 -type d | head -n 1)
            if [ -n "$CLANG_SUBDIR" ]; then
              mv "$CLANG_SUBDIR"/* "$CLANG_DIR/"
            fi
          fi
          
          echo "CLANG_VERSION=ZyC Clang 15.0.7" >> $GITHUB_ENV

      - name: 🛠️ Fix Resource Errors
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          [ -f kernel/sched/sched.h ] && sed -i 's/cpu_rq(cpu)->cfs->cumulative_runnable_avg/cpu_rq(cpu)->cfs.cumulative_runnable_avg/g' kernel/sched/sched.h

          BRANCH="${{ inputs.KERNEL_BRANCH }}"
          if [ "$BRANCH" == "oldcam-ksun" ]; then
            echo "Removing __nocfi macro for KernelSU Next..."
            find drivers/kernelsu KernelSU-Next -type f -name "*.c" -exec sed -i 's/__nocfi//g' {} + 2>/dev/null || true
            find drivers/kernelsu KernelSU-Next -type f -name "*.h" -exec sed -i 's/__nocfi//g' {} + 2>/dev/null || true
          fi

      - name: ⚙️ Generate Defconfig
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          export PATH="$GITHUB_WORKSPACE/$CLANG_DIR/bin:$PATH"
          
          make O=$OUT_DIR ARCH=${{ env.ARCH }} \
            CC="$GITHUB_WORKSPACE/$CLANG_DIR/bin/clang" \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- ${{ env.DEFCONFIG }}

      - name: 📝 Apply Tweak & Configs
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          export PATH="$GITHUB_WORKSPACE/$CLANG_DIR/bin:$PATH"
          
          sed -i 's/CONFIG_DEFAULT_HOSTNAME=".*/CONFIG_DEFAULT_HOSTNAME="'"${{ inputs.DEFAULT_HOSTNAME }}"'"/' "$OUT_DIR/.config"
          [ -n "${{ inputs.LOCALVERSION }}" ] && sed -i 's/CONFIG_LOCALVERSION=".*/CONFIG_LOCALVERSION="'"${{ inputs.LOCALVERSION }}"'"/' "$OUT_DIR/.config"

          enable_config() { ./scripts/config --file "$OUT_DIR/.config" --enable "$1"; }
          disable_config() { ./scripts/config --file "$OUT_DIR/.config" --disable "$1"; }
          set_config() { ./scripts/config --file "$OUT_DIR/.config" --set-val "$1" "$2"; }
          set_str() { ./scripts/config --file "$OUT_DIR/.config" --set-str "$1" "$2"; }
          
          if [ "${{ inputs.QTI_HAPTICS }}" == "true" ]; then
            echo "📳 Enabling QTI Haptics support..."
            enable_config CONFIG_INPUT_QTI_HAPTICS
          fi

          if [ "${{ inputs.APPLY_TWEAKS }}" == "true" ]; then
            echo "🚀 Applying EAS Performance & Gaming Tweaks..."
            disable_config CONFIG_KASAN
            disable_config CONFIG_LOCKDEP
            disable_config CONFIG_MSM_KGSL_DEBUG
            set_config CONFIG_HZ 300
            enable_config CONFIG_HZ_300
            enable_config CONFIG_NO_HZ_IDLE
            enable_config CONFIG_SCHED_AUTOGROUP
            disable_config CONFIG_PM_AUTOSLEEP
            disable_config CONFIG_WQ_POWER_EFFICIENT_DEFAULT
            enable_config CONFIG_ZRAM
            enable_config CONFIG_ZRAM_LZ4_COMPRESS
            enable_config CONFIG_TCP_CONG_BBR
            set_str CONFIG_DEFAULT_TCP_CONG bbr
            enable_config CONFIG_MQ_IOSCHED_KYBER
            enable_config CONFIG_IOSCHED_BFQ
            set_str CONFIG_DEFAULT_IOSCHED "kyber"
            enable_config CONFIG_CPU_FREQ_GOV_SCHEDUTIL
            set_str CONFIG_DEFAULT_GOVERNOR schedutil
            enable_config CONFIG_SCHED_WALT
            enable_config CONFIG_ENERGY_MODEL
            enable_config CONFIG_SCHED_TUNE
            enable_config CONFIG_DYNAMIC_STUNE_BOOST
            enable_config CONFIG_CPU_BOOST
            enable_config CONFIG_CPU_INPUT_BOOST
            enable_config CONFIG_MSM_ADRENO_IDLER
          fi
          
          BRANCH="${{ inputs.KERNEL_BRANCH }}"
          if ([ "$BRANCH" == "oldcam" ] && [ "${{ inputs.INJECT_KSU }}" == "true" ]) || [ "$BRANCH" == "oldcam-ksun" ] || [ "$BRANCH" == "oldcam-resukisu" ]; then
            echo "🦊 Injecting KernelSU Config..."
            enable_config CONFIG_KSU
            enable_config CONFIG_KSU_TAMPER_SYSCALL_TABLE
          fi

          make O=$OUT_DIR ARCH=${{ env.ARCH }} \
            CC="$GITHUB_WORKSPACE/$CLANG_DIR/bin/clang" \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- olddefconfig

      - name: 🏗️ Build Kernel Image
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          export PATH="/usr/lib/ccache:$GITHUB_WORKSPACE/$CLANG_DIR/bin:$PATH"
          export KBUILD_BUILD_USER="${{ inputs.BUILD_USER }}"
          export KBUILD_BUILD_HOST="${{ inputs.BUILD_HOST }}"
          
          make -j$(nproc --all) O=$OUT_DIR ARCH=${{ env.ARCH }} \
            CC="ccache $GITHUB_WORKSPACE/$CLANG_DIR/bin/clang" \
            HOSTCC="ccache $GITHUB_WORKSPACE/$CLANG_DIR/bin/clang" \
            HOSTCXX="ccache $GITHUB_WORKSPACE/$CLANG_DIR/bin/clang++" \
            AR="$GITHUB_WORKSPACE/$CLANG_DIR/bin/llvm-ar" \
            NM="$GITHUB_WORKSPACE/$CLANG_DIR/bin/llvm-nm" \
            OBJCOPY="$GITHUB_WORKSPACE/$CLANG_DIR/bin/llvm-objcopy" \
            OBJDUMP="$GITHUB_WORKSPACE/$CLANG_DIR/bin/llvm-objdump" \
            STRIP="$GITHUB_WORKSPACE/$CLANG_DIR/bin/llvm-strip" \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            CONFIG_LOCALVERSION_AUTO=n \
            KCFLAGS="-Wno-address -Wno-implicit-function-declaration" 2>&1 | tee build.log

          if [ ! -f "$OUT_DIR/arch/arm64/boot/Image.xz-dtb" ] && [ ! -f "$OUT_DIR/arch/arm64/boot/Image.xz" ] && [ ! -f "$OUT_DIR/arch/arm64/boot/Image" ]; then
            echo "❌ Kernel image not found!"
            exit 1
          fi
          echo "✅ Kernel image created successfully."

      - name: 🔍 Locate Image & Create Flashable Zip
        id: img
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          IMAGE=$(find "$PWD/$OUT_DIR/arch/arm64/boot" -name "Image.xz-dtb" -o -name "Image.xz" -o -name "Image" 2>/dev/null | head -n1)
          cd "$GITHUB_WORKSPACE"
          git clone --depth=1 https://github.com/ExXyrou/san_kernel_flashable AnyKernel3
          cp "$IMAGE" AnyKernel3/
          
          FINAL_LOCALVER="${{ inputs.LOCALVERSION }}"
          [ -z "$FINAL_LOCALVER" ] && FINAL_LOCALVER=$(grep "^CONFIG_LOCALVERSION=" "$GITHUB_WORKSPACE/$KERNEL_DIR/$OUT_DIR/.config" | cut -d'"' -f2) || FINAL_LOCALVER=$(echo "$FINAL_LOCALVER" | sed 's/^-//')
          sed -i -E 's/^(kernel\.string=).*/\1'"$FINAL_LOCALVER"'/' AnyKernel3/anykernel.sh
          
          TIMESTAMP=$(date +'%Y%m%d')
          ZIP_NAME="Kernel-lavender-4.4${{ inputs.LOCALVERSION }}-${TIMESTAMP}.zip"
          cd AnyKernel3 && zip -r9 "$ZIP_NAME" * -x ".git/*"
          echo "zip_path=$GITHUB_WORKSPACE/AnyKernel3/$ZIP_NAME" >> "$GITHUB_OUTPUT"
          echo "zip_name=$ZIP_NAME" >> "$GITHUB_OUTPUT"

      - name: ✅ Notify Telegram & Send Kernel - Build Success
        if: success()
        run: |
          END_TIME=$(date +%s)
          DURATION=$((END_TIME - ${{ env.BUILD_START_TIME }}))
          DURATION_STR="$((DURATION / 60))m $((DURATION % 60))s"

          MESSAGE=$(printf '✅ <b>BUILD SUCCESS</b>\n\n📱 <b>Device:</b> Lavender\n🌿 <b>Branch:</b> %s\n🏷️ <b>Kernel name:</b> 4.4%s\n📳 <b>Supported QTI Haptics:</b> %s\n🦊 <b>KernelSU Variant:</b> %s\n🛠️ <b>Clang Version:</b> ZyC Clang 15.0.7\n⏱️ <b>Time Elapsed:</b> %s' "${{ inputs.KERNEL_BRANCH }}" "${{ inputs.LOCALVERSION }}" "${{ inputs.QTI_HAPTICS }}" "${{ steps.ksu-info.outputs.ksu_name }}" "$DURATION_STR")
          
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.BOT_API }}/sendDocument" \
            -F chat_id="${{ secrets.CHAT_ID }}" \
            -F document="@${{ steps.img.outputs.zip_path }}" \
            -F parse_mode="HTML" \
            -F caption="$MESSAGE"

      - name: ❌ Notify Telegram & Send Log - Build Failed
        if: failure()
        run: |
          END_TIME=$(date +%s)
          DURATION=$((END_TIME - ${{ env.BUILD_START_TIME }}))
          DURATION_STR="$((DURATION / 60))m $((DURATION % 60))s"

          MESSAGE=$(printf '❌ <b>BUILD FAILED</b>\n\n📱 <b>Device:</b> Lavender\n🌿 <b>Branch:</b> %s\n🏷️ <b>Kernel name:</b> 4.4%s\n📳 <b>Supported QTI Haptics:</b> %s\n🦊 <b>KernelSU Variant:</b> %s\n🛠️ <b>Clang Version:</b> ZyC Clang 15.0.7\n⏱️ <b>Time Elapsed:</b> %s\n\n💥 <i>Please check the build.log file above.</i>' "${{ inputs.KERNEL_BRANCH }}" "${{ inputs.LOCALVERSION }}" "${{ inputs.QTI_HAPTICS }}" "${{ steps.ksu-info.outputs.ksu_name }}" "$DURATION_STR")
          
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.BOT_API }}/sendDocument" \
            -F chat_id="${{ secrets.CHAT_ID }}" \
            -F document="@${{ env.KERNEL_DIR }}/build.log" \
            -F parse_mode="HTML" \
            -F caption="$MESSAGE"
